# =====================================================================
# Nirmana-Shell - Transpiled Theme: velvet
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$cmd_duration\
$fill\
$python\
$golang\
$nodejs\
$ruby\
$java\
$line_break\
$character\
"""

[fill]
symbol = " "

[directory]
format = "[  $path ](fg:#EFDCF9 bg:#170B3B)"
truncation_length = 3
truncation_symbol = "…/"

[git_status]
format = "([$all_status$ahead_behind ](fg:#EFDCF9 bg:#341948))"
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[git_branch]
format = "[](fg:#170B3B bg:#341948)[  $branch](fg:#EFDCF9 bg:#341948)"

[cmd_duration]
format = "[](fg:#341948 bg:#4c1f5e)[  $duration ](fg:#EFDCF9 bg:#4c1f5e)[](fg:#4c1f5e) "
min_time = 1

[python]
format = "[](fg:#4c1f5e)[ 󰌠 $version ](fg:#E4F34A bg:#4c1f5e)"

[golang]
format = "[  $version ](fg:#7FD5EA bg:#4c1f5e)"

[nodejs]
format = "[ 󰎙 $version ](fg:#42E66C bg:#4c1f5e)"

[ruby]
format = "[  $version ](fg:#E64747 bg:#4c1f5e)"

[java]
format = "[  $version ](fg:#E64747 bg:#4c1f5e)"

[character]
success_symbol = "[❯](bold green) "
error_symbol = "[❯](bold red) "
