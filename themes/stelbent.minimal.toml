# =====================================================================
# Nirmana-Shell - Transpiled Theme: stelbent.minimal
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$fill\
$shell\
$time\
$line_break\
$character\
"""

[fill]
symbol = " "

[directory]
format = "[ $path](fg:cyan) "
truncation_length = 3
truncation_symbol = "…/"

[git_status]
format = "([$all_status$ahead_behind](red) )"
modified = " ✎"
staged = " "

[git_branch]
format = "[ $branch](purple) "

[shell]
format = "[  $version ](fg:#007acc)"

[time]
format = "[  $time ](fg:#689f38)"
disabled = false
time_format = "%H:%M:%S"

[character]
success_symbol = "[\\$ ](bold #ffffff) "
error_symbol = "[\\$ ](bold #ef5350) "
