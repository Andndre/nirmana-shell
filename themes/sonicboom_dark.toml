# =====================================================================
# Nirmana-Shell - Transpiled Theme: sonicboom_dark
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$fill\
$username\
$cmd_duration\
$time\
$line_break\
$sudo\
$character\
"""

[fill]
symbol = " "

[sudo]
disabled = false
symbol = "⚡ "
format = "[⚡ ](#dd1e1e) "

[directory]
format = "[](fg:#272727)[ $path](fg:#43CCEA bg:#272727)[](fg:#272727) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[](fg:#272727)[ $branch](fg:#00ff0d bg:#272727)"

[git_status]
format = "([$all_status$ahead_behind](fg:#00ff0d bg:#272727)[](fg:#272727) )"
modified = " "
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[cmd_duration]
min_time = 1
format = "[](fg:#272727)[ $duration](fg:#ffffff bg:#272727)[](fg:#272727) "

[username]
show_always = true
format = "[](fg:#272727)[$user](fg:#43CCEA bg:#272727) "

[time]
disabled = false
time_format = "%I:%M:%S %p"
format = "[ $time](fg:#43CCEA bg:#272727)[](fg:#272727) "

[character]
success_symbol = "[❯ ](bold #00ff0d) "
error_symbol = "[❯ ](bold #ff0000) "
