# =====================================================================
# Nirmana-Shell - Transpiled Theme: sonicboom_dark
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$cmd_duration\
$fill\
$username\
$time\
$line_break\
$character\
"""

[fill]
symbol = " "

[directory]
format = "[  $path ](fg:#43CCEA bg:#272727)"
truncation_length = 3
truncation_symbol = "…/"

[git_status]
format = "([$all_status$ahead_behind ](fg:#00ff0d bg:#272727))"
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[git_branch]
format = "[  $branch](fg:#00ff0d bg:#272727)"

[cmd_duration]
format = "[  $duration ](fg:#ffffff bg:#272727)[](fg:#272727) "
min_time = 1

[username]
format = "[](fg:#272727)[ $user ](fg:#43CCEA bg:#272727)"

[time]
format = "[  $time ](fg:#43CCEA bg:#272727)"
disabled = false
time_format = "%I:%M:%S %p"

[character]
success_symbol = "[ ](bold #00ff0d) "
error_symbol = "[ ](bold #ff0000) "
