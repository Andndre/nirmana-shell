# =====================================================================
# Nirmana-Shell - Transpiled Theme: gruvbox
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = false

format = """
$directory\
$git_branch\
$git_status\
$golang\
$julia\
$python\
$ruby\
$character\
"""

[directory]
format = "[  $path ](fg:#282828 bg:#458588)"
truncation_length = 3
truncation_symbol = "…/"

[git_status]
format = "([$all_status$ahead_behind ](fg:#282828 bg:#98971A))"
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[git_branch]
format = "[](fg:#458588 bg:#98971A)[  $branch](fg:#282828 bg:#98971A)"

[golang]
format = "[](fg:#98971A bg:#8ED1F7)[  $version ](fg:#111111 bg:#8ED1F7)"

[julia]
format = "[](fg:#8ED1F7 bg:#4063D8)[  $version ](fg:#111111 bg:#4063D8)"

[python]
format = "[](fg:#4063D8 bg:#FFDE57)[ 󰌠 $version ](fg:#111111 bg:#FFDE57)"

[ruby]
format = "[](fg:#FFDE57 bg:#AE1401)[  $version ](fg:#ffffff bg:#AE1401)[](fg:#AE1401) "

[character]
success_symbol = ""
error_symbol = ""
