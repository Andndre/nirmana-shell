# =====================================================================
# Nirmana-Shell - Transpiled Theme: gruvbox
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$golang\
$julia\
$python\
$ruby\
$aws\
$sudo\
$line_break\
$character\
"""

[directory]
format = "[](fg:#458588)[ $path](fg:#282828 bg:#458588)[](fg:#458588) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[ $branch](fg:#282828 bg:#98971A)"

[git_status]
format = "([$all_status$ahead_behind](fg:#282828 bg:#98971A))"
modified = " "
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[golang]
symbol = " "
format = "[](fg:#8ED1F7)[ $version](fg:#111111 bg:#8ED1F7)[](fg:#8ED1F7) "

[julia]
symbol = " "
format = "[](fg:#4063D8)[ $version](fg:#111111 bg:#4063D8)[](fg:#4063D8) "

[python]
symbol = "󰌠 "
format = "[](fg:#FFDE57)[󰌠 $version](fg:#111111 bg:#FFDE57)[](fg:#FFDE57) "

[ruby]
symbol = " "
format = "[](fg:#AE1401)[ $version](fg:#ffffff bg:#AE1401)[](fg:#AE1401) "

[aws]
symbol = " "
format = "[ $version](#ffffff) "

[sudo]
disabled = false
symbol = "⚡ "
format = "[⚡ ](#111111)"

[character]
success_symbol = "[❯](bold green) "
error_symbol = "[❯](bold red) "
