# =====================================================================
# Nirmana-Shell - Transpiled Theme: hotstick.minimal
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$sudo\
$directory\
$git_branch\
$git_status\
$line_break\
$character\
"""

[sudo]
disabled = false
symbol = "⚡ "
format = "[⚡ ](yellow)"

[directory]
format = "[](fg:lightBlue)[ $path](fg:black bg:lightBlue)[](fg:lightBlue) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[](fg:green)[ $branch](fg:black bg:green)"

[git_status]
format = "([$all_status$ahead_behind](fg:black bg:green)[](fg:green) )"
modified = " "
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[character]
success_symbol = "[❯](bold green) "
error_symbol = "[❯](bold red) "
