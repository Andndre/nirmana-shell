# =====================================================================
# Nirmana-Shell - Transpiled Theme: hotstick.minimal
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler v3.1
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = false

format = """
${env_var.ADMIN}\
$directory\
$git_branch\
$git_status\
$character\
"""

[character]
format = "$symbol"
success_symbol = "[](fg:prev_bg) "
error_symbol = "[](fg:prev_bg) "

[env_var.ADMIN]
variable = "STARSHIP_IS_ADMIN"
style = "bold #FFD740"
format = "[ ⚡ ]($style) "

[directory]
format = "[](fg:#80D8FF)[ $path ](fg:#000000 bg:#80D8FF)[](fg:#80D8FF)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[](fg:#69F0AE inverted)[  $branch ](fg:#000000 bg:#69F0AE)"

[git_status]
format = "([$all_status$ahead_behind ](fg:#000000 bg:#69F0AE))"
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"
