# =====================================================================
# Nirmana-Shell - Transpiled Theme: larserikfinholt
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler v3.1
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = false

format = """
$username\
$directory\
$git_branch\
$git_status\
$cmd_duration\
$character\
"""

[character]
format = "[](fg:prev_bg) "
success_symbol = ""
error_symbol = ""

[username]
format = "[](fg:#c386f1)[ $user ](fg:#ffffff bg:#c386f1)[](fg:#c386f1)"
show_always = true

[directory]
format = "[](fg:#ff479c inverted)[ $path ](fg:#ffffff bg:#ff479c)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[](fg:prev_bg bg:#fffb38)[  $branch ](fg:#193549 bg:#fffb38)"

[git_status]
format = "([$all_status$ahead_behind ](fg:#193549 bg:#fffb38))[](fg:#fffb38)"
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[cmd_duration]
format = "[](fg:#83769c inverted)[  $duration ](fg:#ffffff bg:#83769c)"
min_time = 0
show_milliseconds = true
