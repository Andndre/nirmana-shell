# =====================================================================
# Nirmana-Shell - Transpiled Theme: larserikfinholt
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = false

format = """
$username\
$directory\
$git_branch\
$git_status\
$cmd_duration\
$character\
"""

[username]
format = "[](fg:#c386f1)[$user ](fg:#ffffff bg:#c386f1)"
show_always = true

[directory]
format = "[](fg:#c386f1 bg:#ff479c)[  $path ](fg:#ffffff bg:#ff479c)"
truncation_length = 3
truncation_symbol = "…/"

[git_status]
format = "([$all_status$ahead_behind ](fg:#193549 bg:#fffb38))"
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[git_branch]
format = "[](fg:#ff479c bg:#fffb38)[  $branch](fg:#193549 bg:#fffb38)"

[cmd_duration]
format = "[](fg:#fffb38 bg:#83769c)[  $duration ](fg:#ffffff bg:#83769c)[](fg:#83769c) "
min_time = 1

[character]
success_symbol = ""
error_symbol = ""
