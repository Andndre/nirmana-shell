# =====================================================================
# Nirmana-Shell - Transpiled Theme: pararussel
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$character\
$line_break\
$character\
"""

[directory]
format = "[ $path](#56B6C2) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[$branch](#D0666F)"

[git_status]
format = "([$all_status$ahead_behind](#D0666F) )"
modified = " "
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[character]
success_symbol = "[❯ ](bold #DCB977) "
error_symbol = "[❯ ](bold #ef5350) "
