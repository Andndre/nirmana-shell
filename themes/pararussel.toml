# =====================================================================
# Nirmana-Shell - Transpiled Theme: pararussel
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$line_break\
$character\
"""

[directory]
format = "[ $path](fg:#56B6C2) "
truncation_length = 3
truncation_symbol = "…/"

[git_status]
format = "([$all_status$ahead_behind](red) )"
modified = " ✎"
staged = " "

[git_branch]
format = "[ $branch](#D0666F) "

[character]
success_symbol = "[ ](bold #ffffff) "
error_symbol = "[ ](bold #ef5350) "
