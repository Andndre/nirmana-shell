# =====================================================================
# Nirmana-Shell - Transpiled Theme: if_tea
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$memory_usage\
$cmd_duration\
$git_branch\
$git_status\
$fill\
$git_branch\
$git_status\
$line_break\
$shell\
$time\
$sudo\
$directory\
$character\
"""

[fill]
symbol = " "

[memory_usage]
disabled = false
threshold = 0
format = "[MEM: $ram_pct](fg:#000000 bg:#00c7fc)[](bg:#00c7fc) "

[cmd_duration]
min_time = 1
format = "[ $duration](fg:#ffffff bg:#2343e2) "

[git_branch]
format = "[ $branch](fg:#000000 bg:#ee79d1)"

[git_status]
format = "([$all_status$ahead_behind](fg:#000000 bg:#ee79d1))"
modified = " "
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[shell]
symbol = " "
format = "[ $indicator](fg:#000000 bg:#91f2ff)[](bg:#91f2ff) "

[time]
disabled = false
time_format = "%I:%M:%S %p | %A"
format = "[$time](fg:#000000 bg:#ff8c94) "

[sudo]
disabled = false
symbol = " "
format = "[ ](yellow)"

[directory]
format = "[](bg:#F8677b)[ $path](fg:#000000 bg:#f8677b) "
truncation_length = 3
truncation_symbol = "…/"

[character]
success_symbol = "[❯ ](bold #00BCF9) "
error_symbol = "[❯ ](bold #ef5350) "

