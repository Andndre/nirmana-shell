# =====================================================================
# Nirmana-Shell - Transpiled Theme: catppuccin
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler v3.1
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = false

format = """
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$character\
"""

[character]
format = "$symbol"
success_symbol = "[](fg:prev_bg) "
error_symbol = "[](fg:prev_bg) "

[os]
disabled = false
style = "fg:#FFFFFF bg:#8AADF4"
format = "[](fg:#8AADF4)[ $symbol ]($style)"

[os.symbols]
Windows = "󰕮"
Ubuntu = ""
Macos = ""
Linux = ""

[username]
format = "[ ](fg:#494D64 bg:#8AADF4)[ $user](fg:#494D64 bg:#8AADF4)"
show_always = true

[hostname]
format = "[@$hostname ](fg:#494D64 bg:#8AADF4)"
ssh_only = false

[directory]
format = "[](fg:prev_bg bg:#F5BDE6)[ $path ](fg:#494D64 bg:#F5BDE6)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[](fg:prev_bg bg:#B7BDF8)[  $branch ](fg:#494D64 bg:#B7BDF8)"

[git_status]
format = "([$all_status$ahead_behind ](fg:#494D64 bg:#B7BDF8))"
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"
