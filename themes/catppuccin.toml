# =====================================================================
# Nirmana-Shell - Transpiled Theme: catppuccin
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$username\
$directory\
$git_branch\
$git_status\
$line_break\
$character\
"""

[username]
show_always = true
format = "[](fg:p:blue)[ $user](fg:p:text bg:p:blue)[](fg:p:blue) "

[directory]
format = "[](fg:p:pink)[ $path](fg:p:text bg:p:pink)[](fg:p:pink) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[](fg:p:lavender)[ $branch](fg:p:text bg:p:lavender)"

[git_status]
format = "([$all_status$ahead_behind](fg:p:text bg:p:lavender)[](fg:p:lavender) )"
modified = " "
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[character]
success_symbol = "[❯](bold green) "
error_symbol = "[❯](bold red) "
