# =====================================================================
# Nirmana-Shell - Transpiled Theme: catppuccin
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = false

format = """
$username\
$directory\
$git_branch\
$git_status\
$character\
"""

[username]
format = "[](fg:#8AADF4)[$user ](fg:#494D64 bg:#8AADF4)"
show_always = true

[directory]
format = "[](fg:#8AADF4 bg:#F5BDE6)[  $path ](fg:#494D64 bg:#F5BDE6)"
truncation_length = 3
truncation_symbol = "…/"

[git_status]
format = "([$all_status$ahead_behind ](fg:#494D64 bg:#B7BDF8))[](fg:#B7BDF8) "
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[git_branch]
format = "[](fg:#F5BDE6 bg:#B7BDF8)[  $branch](fg:#494D64 bg:#B7BDF8)"

[character]
success_symbol = ""
error_symbol = ""
