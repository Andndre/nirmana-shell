# =====================================================================
# Nirmana-Shell - Transpiled Theme: thecyberden
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler v3.1
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$status\
$fill\
$time\
$line_break\
${env_var.ADMIN}\
$shell\
$character\
"""

[fill]
symbol = " "

[character]
success_symbol = "[ ](bold #ffffff) "
error_symbol = "[ ](bold #ef5350) "

[username]
format = "[](fg:#2e9599)[ $user](fg:#ffffff bg:#2e9599)"
show_always = true

[hostname]
format = "[@$hostname ](fg:#ffffff bg:#2e9599)"
ssh_only = false

[directory]
format = "[](fg:prev_bg bg:#0080ff)[  $path ](fg:#ffffff bg:#0080ff)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[](fg:prev_bg bg:#c19c00)[  $branch ](fg:#000000 bg:#c19c00)"

[git_status]
format = "([$all_status$ahead_behind ](fg:#000000 bg:#c19c00))"
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[status]
format = "[](fg:prev_bg bg:#2e9599)[ $symbol ](fg:#ffffff bg:#2e9599)[](fg:#2e9599) "
disabled = false
symbol = "❌"
success_symbol = "❌"

[time]
format = "[](fg:#2e9599 bg:prev_bg)[ $time ](fg:#ffffff bg:#2e9599)[](fg:#2e9599)"
disabled = false
time_format = "%H:%M:%S"

[env_var.ADMIN]
variable = "STARSHIP_IS_ADMIN"
style = "bold #ff0000"
format = "[ ⚡ ]($style) "

[shell]
disabled = false
powershell_indicator = "pwsh"
bash_indicator = "bash"
zsh_indicator = "zsh"
style = "fg:#ffffff bg:#FEF5ED"
format = "[](fg:prev_bg bg:#FEF5ED)[  $indicator ]($style)"
