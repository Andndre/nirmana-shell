# =====================================================================
# Nirmana-Shell - Custom Theme: Paradox Theme
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$fill\
$bun\
$dart\
$nodejs\
$python\
$package\
$cmd_duration\
$line_break\
$character"""

[fill]
symbol = " "

[character]
success_symbol = "[❯](bold #007ACC) "
error_symbol = "[❯](bold #ff8080) "

[directory]
format = "[  $path ](bg:#007ACC fg:#ffffff)[](fg:#007ACC bg:#95ffa4)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[  $branch](bg:#95ffa4 fg:#193549)"

[git_status]
format = "[$all_status$ahead_behind](bg:#95ffa4 fg:#193549)[](fg:#95ffa4) "
style = "bg:#95ffa4 fg:#193549"
conflicted = " 󰞇"
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"
untracked = " ?"
stashed = " "
modified = " !"
staged = " +"
renamed = " »"
deleted = " ✘"

[bun]
format = "[](fg:#100e23)[ $version](bg:#100e23 fg:#FEAC19)[](fg:#100e23) "
version_format = "v${raw}"

[dart]
symbol = " "
format = "[](fg:#100e23)[$symbol$version](bg:#100e23 fg:#91ddff)[](fg:#100e23) "
version_format = "v${raw}"

[nodejs]
symbol = "󰎙 "
format = "[](fg:#100e23)[$symbol$version](bg:#100e23 fg:#95ffa4)[](fg:#100e23) "
version_format = "v${raw}"

[python]
symbol = "󰌠 "
format = "[](fg:#100e23)[$symbol$version](bg:#100e23 fg:#ffe9aa)[](fg:#100e23) "
version_format = "v${raw}"

[package]
symbol = "󰏗 "
format = "[](fg:#100e23)[$symbol$version](bg:#100e23 fg:#906cff)[](fg:#100e23) "
version_format = "v${raw}"
disabled = false

[cmd_duration]
min_time = 2_000
format = "[](fg:#100e23)[ $duration](bg:#100e23 fg:#ffffff)[](fg:#100e23) "
