# =====================================================================
# Nirmana-Shell - Signature Theme (Clean Contrast & Geometric Accents)
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$php\
$nodejs\
$python\
$cmd_duration\
$line_break\
$character"""

# 1. Prompt Character (Vibrant Cyan on success, Vivid Coral on error)
[character]
success_symbol = "[❯](bold #00F0FF)"
error_symbol = "[❯](bold #FF4757)"

# 2. Directory (Crisp White on dark background)
[directory]
truncation_length = 3
truncation_symbol = "…/"
style = "bold #F8F9FA"
read_only = " 󰌾"

# 3. Git Branch (Amethyst Purple) & Status (Warm Amber & Silver)
[git_branch]
symbol = " "
style = "bold #A29BFE"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold #FED330"
format = '([\[$all_status$ahead_behind\]]($style) )'
conflicted = "󰞇 "
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = " "
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

# 4. Command Duration
[cmd_duration]
min_time = 2_000
style = "bold #A4B0BE"
format = "took [$duration]($style) "

# 5. Language Runtimes
[php]
symbol = " "
style = "bold #777BB4"
format = "[$symbol($version )]($style)"

[nodejs]
symbol = "󰎙 "
style = "bold #2ED573"
format = "[$symbol($version )]($style)"

[python]
symbol = "󰌠 "
style = "bold #FFA502"
format = "[$symbol($version )]($style)"

# 6. Disabled unused modules
[package]
disabled = true
[battery]
disabled = true
[dotnet]
disabled = true
[aws]
disabled = true
[gcloud]
disabled = true
[azure]
disabled = true
[docker_context]
disabled = true
