# =====================================================================
# Nirmana-Shell - Transpiled Theme: bubblesline
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler v3.1
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = false

format = """
$username\
$character\
"""

[username]
style_user = "fg:#9B6BDF bg:#424242"
style_root = "fg:#FFEB3B bg:#424242"
format = "[](fg:#424242)[ $user ]($style)"
show_always = true

[character]
format = "$symbol"
success_symbol = "[❯ ](bold #9B6BDF bg:#424242)[](fg:#424242) "
error_symbol = "[❯ ](bold #ef5350 bg:#424242)[](fg:#424242) "

[directory]
format = "[](fg:#424242)[  $path ](fg:#3EC669 bg:#424242)[](fg:#424242) "

[git_branch]
format = "[](fg:#424242)[  $branch ](fg:#43CCEA bg:#424242)[](fg:#424242) "

[python]
format = "[](fg:#424242)[ 󰌠 $version ](fg:#E4F34A bg:#424242)[](fg:#424242) "

[golang]
format = "[](fg:#424242)[  $version ](fg:#7FD5EA bg:#424242)[](fg:#424242) "

[nodejs]
format = "[](fg:#424242)[  $version ](fg:#42E66C bg:#424242)[](fg:#424242) "

[ruby]
format = "[](fg:#424242)[  $version ](fg:#E64747 bg:#424242)[](fg:#424242) "

[java]
format = "[](fg:#424242)[  $version ](fg:#E64747 bg:#424242)[](fg:#424242) "

[julia]
format = "[](fg:#424242)[  $version ](fg:#9B6BDF bg:#424242)[](fg:#424242) "

[battery]
format = "[](fg:#424242)[ 󰁹 $percentage ](fg:#9B6BDF bg:#424242)[](fg:#424242) "
disabled = false

[[battery.display]]
threshold = 100
style = "bold #A6E3A1"
