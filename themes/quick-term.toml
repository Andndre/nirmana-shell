# =====================================================================
# Nirmana-Shell - Transpiled Theme: quick-term
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler v3.1
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$os\
$username\
$directory\
$git_branch\
$git_status\
$fill\
$cmd_duration\
$time\
$line_break\
$character\
"""

[fill]
symbol = " "

[character]
format = "[╰─ {{ if .Root }}#{{else}}${{end}}](fg:#d75f00) $symbol"
success_symbol = ""
error_symbol = "[x ](bold #ef5350)"

[os]
disabled = false
style = "fg:#f2f3f8 bg:#d75f00"
format = "[╭─](fg:#d75f00)[ $symbol ]($style)"

[os.symbols]
Windows = "󰕮"
Ubuntu = ""
Macos = ""
Linux = ""

[username]
format = "[](fg:prev_bg bg:#e4e4e4)[ $user ](fg:#4e4e4e bg:#e4e4e4)"
show_always = true

[directory]
format = "[](fg:prev_bg bg:#0087af)[ $path ](fg:#f2f3f8 bg:#0087af)[](fg:#0087af)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[](fg:#378504 inverted)[  $branch ](fg:#f2f3f8 bg:#378504)"

[git_status]
format = "([$all_status$ahead_behind ](fg:#f2f3f8 bg:#378504))[](fg:#378504) "
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[cmd_duration]
format = "[](fg:#e4e4e4 bg:prev_bg)[  $duration ](fg:#585858 bg:#e4e4e4)"
min_time = 2000

[time]
format = "[](fg:#d75f00 bg:prev_bg)[  $time ](fg:#f2f3f8 bg:#d75f00)[](fg:#d75f00)"
disabled = false
time_format = "%H:%M:%S"
