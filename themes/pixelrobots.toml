# =====================================================================
# Nirmana-Shell - Transpiled Theme: pixelrobots
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler v3.1
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$azure\
$aws\
$line_break\
$os\
$username\
${env_var.ADMIN}\
$directory\
$git_branch\
$git_status\
$character\
"""

[character]
success_symbol = "[❯ ](bold #ffea00) "
error_symbol = "[❯ ](bold #ef5350) "

[azure]
format = "[  $subscription ](fg:#FFFFFF bg:#012456)"
disabled = false

[aws]
format = "[](fg:prev_bg bg:#FFA400)[  $version ](fg:#000000 bg:#FFA400)[](fg:#FFA400) "

[os]
disabled = false
style = "fg:#26C6DA bg:#2f2f2f"
format = "[▓](fg:#2f2f2f)[ $symbol ]($style)[ ](fg:#26C6DA bg:#2f2f2f)"

[os.symbols]
Windows = "󰕮"
Ubuntu = ""
Macos = ""
Linux = ""

[username]
format = "[ ](fg:#ffea00 bg:#2f2f2f)[ $user ](fg:#ffea00 bg:#2f2f2f)"
show_always = true

[env_var.ADMIN]
variable = "STARSHIP_IS_ADMIN"
style = "fg:#ffea00 bg:#2f2f2f"
format = "[ ](fg:#ffea00 bg:#2f2f2f)[ ⚡ ]($style)"

[directory]
format = "[ ](fg:#fafafa bg:#2f2f2f)[  $path ](fg:#fafafa bg:#2f2f2f)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[  $branch ](fg:#ffea00 bg:#2f2f2f)"

[git_status]
format = "([$all_status$ahead_behind ](fg:#ffea00 bg:#2f2f2f))[](fg:#2f2f2f) "
modified = " ~${count}"
staged = " +${count}"
stashed = " *${count}"
ahead = " ↑${count}"
behind = " ↓${count}"
diverged = " ↕↑${ahead_count}↓${behind_count}"
deleted = " -${count}"
