# =====================================================================
# Nirmana-Shell - Transpiled Theme: pixelrobots
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$username\
$directory\
$git_branch\
$git_status\
$fill\
$aws\
$line_break\
$sudo\
$character\
"""

[fill]
symbol = " "

[aws]
symbol = " "
format = "[ $version](fg:#000000 bg:#FFA400)[](fg:#FFA400) "

[username]
show_always = true
format = "[](fg:#2f2f2f)[ $user](fg:#ffea00 bg:#2f2f2f)[](fg:#2f2f2f) "

[sudo]
disabled = false
symbol = " "
format = "[ ](#ffea00) "

[directory]
format = "[](fg:#2f2f2f)[ $path](fg:#fafafa bg:#2f2f2f)[](fg:#2f2f2f) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[](fg:#2f2f2f)[ $branch](fg:#ffea00 bg:#2f2f2f)"

[git_status]
format = "([$all_status$ahead_behind](fg:#ffea00 bg:#2f2f2f)[](fg:#2f2f2f) )"
modified = " "
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[character]
success_symbol = "[❯ ](bold #ffea00) "
error_symbol = "[❯ ](bold #ef5350) "
