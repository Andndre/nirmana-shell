# =====================================================================
# Nirmana-Shell - Transpiled Theme: microverse-power
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$username\
$time\
$directory\
$git_branch\
$git_status\
$line_break\
$character\
"""

[username]
format = "[$user ](fg:#f1184c bg:#242424)"
show_always = true

[time]
format = "[  $time ](fg:#FFBB00 bg:#242424)"
disabled = false
time_format = "%Y-%m-%d %H:%M:%S"

[directory]
format = "[  $path ](fg:#33DD2D bg:#242424)"
truncation_length = 3
truncation_symbol = "…/"

[git_status]
format = "([$all_status$ahead_behind ](fg:#3A86FF bg:#242424))[](fg:#242424) "
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[git_branch]
format = "[  $branch](fg:#3A86FF bg:#242424)"

[character]
success_symbol = "[➜ ](bold #f1184c) "
error_symbol = "[➜ ](bold #ef5350) "
