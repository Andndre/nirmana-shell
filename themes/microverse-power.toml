# =====================================================================
# Nirmana-Shell - Transpiled Theme: microverse-power
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$username\
$sudo\
$time\
$directory\
$git_branch\
$git_status\
$character\
$line_break\
$character\
"""

[username]
show_always = true
format = "[](fg:#242424)[ $user](fg:#f1184c bg:#242424)[](fg:#242424) "

[sudo]
disabled = false
symbol = " "
format = "[ ](#f1184c)"

[time]
disabled = false
time_format = "%Y-%m-%d %H:%M:%S"
format = "[](fg:#242424)[ $time](fg:#FFBB00 bg:#242424)[](fg:#242424) "

[directory]
format = "[](fg:#242424)[ $path](fg:#33DD2D bg:#242424)[](fg:#242424) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[](fg:#242424)[ $branch](fg:#3A86FF bg:#242424)"

[git_status]
format = "([$all_status$ahead_behind](fg:#3A86FF bg:#242424)[](fg:#242424) )"
modified = " "
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[character]
success_symbol = "[❯ ](bold #242424) "
error_symbol = "[❯ ](bold #ef5350) "
