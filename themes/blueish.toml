# =====================================================================
# Nirmana-Shell - Transpiled Theme: blueish
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$username\
$battery\
$directory\
$git_branch\
$git_status\
$nodejs\
$line_break\
$character\
"""

[username]
format = "[](fg:#546E7A)[$user ](fg:#26C6DA bg:#546E7A)"
show_always = true

[battery]
format = "[](fg:#546E7A bg:#a2beef)[ 󰁹 $percentage ](fg:#193549 bg:#a2beef)"

[directory]
format = "[](fg:#a2beef bg:#14c2dd)[  $path ](fg:#193549 bg:#14c2dd)"
truncation_length = 3
truncation_symbol = "…/"

[git_status]
format = "([$all_status$ahead_behind ](fg:#193549 bg:#a2c4e0))"
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[git_branch]
format = "[](fg:#14c2dd bg:#a2c4e0)[  $branch](fg:#193549 bg:#a2c4e0)"

[nodejs]
format = "[](fg:#a2c4e0 bg:#6CA35E)[ 󰎙 $version ](fg:#ffffff bg:#6CA35E)[](fg:#6CA35E) "

[character]
success_symbol = "[➜ ](bold #007ACC) "
error_symbol = "[➜ ](bold #ef5350) "
