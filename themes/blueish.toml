# =====================================================================
# Nirmana-Shell - Transpiled Theme: blueish
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$username\
$battery\
$directory\
$git_branch\
$git_status\
$nodejs\
$sudo\
$line_break\
$character\
"""

[username]
show_always = true
format = "[](fg:#546E7A)[ $user](fg:#26C6DA bg:#546E7A)[](fg:#546E7A) "

[battery]
disabled = false
format = "[$symbol$percentage](fg:#193549 bg:#a2beef)[](fg:#a2beef) "

[directory]
format = "[ $path](fg:#193549 bg:#14c2dd)[](fg:#14c2dd) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[](fg:#a2c4e0)[ $branch](fg:#193549 bg:#a2c4e0)"

[git_status]
format = "([$all_status$ahead_behind](fg:#193549 bg:#a2c4e0)[](fg:#a2c4e0) )"
modified = " "
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[nodejs]
symbol = "󰎙 "
format = "[󰎙 $version](fg:#ffffff bg:#6CA35E)[](fg:#6CA35E) "

[sudo]
disabled = false
symbol = " "
format = "[ ](#193549)"

[character]
success_symbol = "[❯ ](bold #007800) "
error_symbol = "[❯ ](bold #ef5350) "
