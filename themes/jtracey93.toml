# =====================================================================
# Nirmana-Shell - Transpiled Theme: jtracey93
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$username\
$directory\
$git_branch\
$git_status\
$time\
$cmd_duration\
$character\
$line_break\
$character\
"""

[username]
show_always = true
format = "[](fg:#EB9654)[$user](fg:#ffffff bg:#EB9654)[ on](white) "

[directory]
format = "[](fg:lightYellow)[ $path](fg:#3f3f3f bg:lightYellow)[](fg:lightYellow) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[](fg:#25AFF3)[ $branch](fg:#ffffff bg:#25AFF3)"

[git_status]
format = "([$all_status$ahead_behind](fg:#ffffff bg:#25AFF3)[](fg:#25AFF3) )"
modified = " "
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[time]
disabled = false
time_format = "%H:%M:%S"
format = "[](fg:#cc00ff)[ $time](fg:#ffffff bg:#cc00ff)[](fg:#cc00ff) "

[cmd_duration]
min_time = 1
format = "[](fg:#49404f)[ $duration](fg:#ffffff bg:#49404f)[](fg:#49404f) "

[character]
success_symbol = "[❯ ](bold #ffffff) "
error_symbol = "[❯ ](bold #ff0000) "
