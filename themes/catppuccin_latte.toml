# =====================================================================
# Nirmana-Shell - Transpiled Theme: catppuccin_latte
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$username\
$directory\
$git_branch\
$git_status\
$line_break\
$character\
"""

[username]
show_always = true
format = "[ ](#ff70a6)[$user](#1e66f5) "

[directory]
format = "[ $path](#ea76cb) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[ $branch](#7287FD)"

[git_status]
format = "([$all_status$ahead_behind](#7287FD) )"
modified = " "
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[character]
success_symbol = "[❯](bold green) "
error_symbol = "[❯](bold red) "
