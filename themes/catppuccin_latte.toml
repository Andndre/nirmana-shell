# =====================================================================
# Nirmana-Shell - Transpiled Theme: catppuccin_latte
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler v3.1
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = false

format = """
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$character\
"""

[character]
success_symbol = "[ ](bold p:os) "
error_symbol = "[ ](bold #ef5350) "

[os]
disabled = false
style = "bold #ACB0BE"
format = "[ $symbol ]($style) "

[os.symbols]
Windows = ""
Ubuntu = ""
Macos = ""
Linux = ""

[username]
format = "[$user ](bold #1e66f5)"
show_always = true

[hostname]
format = "[@$hostname ](bold #1e66f5) "
ssh_only = true

[directory]
format = "[$path ](fg:#ea76cb) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[ $branch](bold #7287FD)"

[git_status]
format = "([$all_status$ahead_behind](bold #7287FD)) "
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"
