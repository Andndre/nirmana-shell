# =====================================================================
# Nirmana-Shell - Transpiled Theme: night-owl
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler v3.1
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$os\
$sudo\
$directory\
$git_branch\
$git_status\
$cmd_duration\
$fill\
$shell\
$memory_usage\
$aws\
$azure\
$crystal\
$dart\
$dotnet\
$golang\
$haskell\
$java\
$julia\
$kotlin\
$lua\
$nodejs\
$php\
$python\
$ruby\
$rust\
$time\
$line_break\
$character\
"""

[fill]
symbol = " "

[character]
success_symbol = "[ ](bold #22da6e) "
error_symbol = "[ ](bold #ef5350) "
format = "[╰─](fg:#21c7a8)$symbol"

[os]
disabled = false
style = "fg:#011627 bg:#21c7a8"
format = "[╭─](fg:#21c7a8)[ $symbol ]($style)"

[os.symbols]
Windows = "󰕮"
Ubuntu = ""
Macos = ""
Linux = ""

[sudo]
style = "fg:#ffeb95 bg:#ef5350"
format = "[](fg:prev_bg bg:#ef5350)[  ]($style)"
disabled = false

[directory]
format = "[](fg:prev_bg bg:#82AAFF)[ $path ](fg:#011627 bg:#82AAFF)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[](fg:prev_bg bg:#addb67)[  $branch ](fg:#011627 bg:#addb67)"

[git_status]
format = "([$all_status$ahead_behind ](fg:#011627 bg:#addb67))"
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[cmd_duration]
format = "[](fg:#575656)[ $duration ](fg:#d6deeb bg:#575656)[](fg:#575656) "
min_time = 0
show_milliseconds = true

[shell]
format = "[](fg:#d6deeb bg:prev_bg)[  $indicator ](fg:#011627 bg:#d6deeb)"

[memory_usage]
format = "[](fg:#8f43f3 bg:prev_bg)[ 󰍛 $ram_pct ](fg:#ffffff bg:#8f43f3)"
disabled = false
threshold = -1
symbol = ""

[aws]
format = "[](fg:#565656 bg:prev_bg)[  $version ](fg:#faa029 bg:#565656)"

[azure]
format = "[](fg:#ffffff bg:prev_bg)[  $version ](fg:#337bb6 bg:#ffffff)"

[crystal]
format = "[](fg:#ffffff bg:prev_bg)[  $version ](fg:#000000 bg:#ffffff)"

[dart]
format = "[](fg:#e1e8e9 bg:prev_bg)[  $version ](fg:#055b9c bg:#e1e8e9)"

[dotnet]
format = "[](fg:#0e0e0e bg:prev_bg)[ 󰪮 $version ](fg:#0d6da8 bg:#0e0e0e)"

[golang]
format = "[](fg:#ffffff bg:prev_bg)[  $version ](fg:#06aad5 bg:#ffffff)"

[haskell]
format = "[](fg:#100e23 bg:prev_bg)[  $version ](fg:#906cff bg:#100e23)"

[java]
format = "[](fg:#ffffff bg:prev_bg)[  $version ](fg:#ec2729 bg:#ffffff)"

[julia]
format = "[](fg:#945bb3 bg:prev_bg)[  $version ](fg:#ffffff bg:#945bb3)"

[kotlin]
format = "[](fg:#906cff bg:prev_bg)[  $version ](fg:#ffffff bg:#906cff)"

[lua]
format = "[](fg:#ffffff bg:prev_bg)[  $version ](fg:#000081 bg:#ffffff)"

[nodejs]
format = "[](fg:#303030 bg:prev_bg)[  $version ](fg:#3C873A bg:#303030)"

[php]
format = "[](fg:#787CB5 bg:prev_bg)[  $version ](fg:#000000 bg:#787CB5)"

[python]
format = "[](fg:#306998 bg:prev_bg)[ 󰌠 $version ](fg:#FFE873 bg:#306998)"

[ruby]
format = "[](fg:#ffffff bg:prev_bg)[  $version ](fg:#9c1006 bg:#ffffff)"

[rust]
format = "[](fg:#ffffff bg:prev_bg)[  $version ](fg:#000000 bg:#ffffff)"

[time]
format = "[](fg:#234d70 bg:prev_bg)[ $time ](fg:#d6deeb bg:#234d70)[](fg:#234d70)"
disabled = false
time_format = "%H:%M:%S"
