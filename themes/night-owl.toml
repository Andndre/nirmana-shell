# =====================================================================
# Nirmana-Shell - Transpiled Theme: night-owl
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$cmd_duration\
$fill\
$shell\
$memory_usage\
$dart\
$dotnet\
$golang\
$java\
$julia\
$nodejs\
$php\
$python\
$ruby\
$rust\
$time\
$line_break\
$character\
"""

[fill]
symbol = " "

[directory]
format = "[╭─](fg:#82AAFF)[  $path ](fg:#011627 bg:#82AAFF)"
truncation_length = 3
truncation_symbol = "…/"

[git_status]
format = "([$all_status$ahead_behind ](fg:#011627 bg:#addb67))"
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[git_branch]
format = "[](fg:#82AAFF bg:#addb67)[  $branch](fg:#011627 bg:#addb67)"

[cmd_duration]
format = "[](fg:#addb67 bg:#575656)[  $duration ](fg:#d6deeb bg:#575656)[](fg:#575656) "
min_time = 1

[shell]
format = "[](fg:#d6deeb)[  $version ](fg:#011627 bg:#d6deeb)"

[memory_usage]
format = "[](fg:#8f43f3 bg:#d6deeb)[ 󰍛 $ram_pct ](fg:#ffffff bg:#8f43f3)"

[dart]
format = "[](fg:#e1e8e9 bg:#8f43f3)[  $version ](fg:#055b9c bg:#e1e8e9)"

[dotnet]
format = "[](fg:#0e0e0e bg:#e1e8e9)[ 󰪮 $version ](fg:#0d6da8 bg:#0e0e0e)"

[golang]
format = "[](fg:#ffffff bg:#0e0e0e)[  $version ](fg:#06aad5 bg:#ffffff)"

[java]
format = "[  $version ](fg:#ec2729 bg:#ffffff)"

[julia]
format = "[](fg:#945bb3 bg:#ffffff)[  $version ](fg:#ffffff bg:#945bb3)"

[nodejs]
format = "[](fg:#303030 bg:#945bb3)[ 󰎙 $version ](fg:#3C873A bg:#303030)"

[php]
format = "[](fg:#787CB5 bg:#303030)[  $version ](fg:#000000 bg:#787CB5)"

[python]
format = "[](fg:#306998 bg:#787CB5)[ 󰌠 $version ](fg:#FFE873 bg:#306998)"

[ruby]
format = "[](fg:#ffffff bg:#306998)[  $version ](fg:#9c1006 bg:#ffffff)"

[rust]
format = "[  $version ](fg:#000000 bg:#ffffff)"

[time]
format = "[](fg:#234d70 bg:#ffffff)[  $time ](fg:#d6deeb bg:#234d70)"
disabled = false
time_format = "%H:%M:%S"

[character]
success_symbol = "[ ](bold #22da6e) "
error_symbol = "[ ](bold #ef5350) "
