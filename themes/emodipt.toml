# =====================================================================
# Nirmana-Shell - Transpiled Theme: emodipt
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler v3.1
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = false

format = """
${env_var.ADMIN}\
$directory\
$git_branch\
$git_status\
$status\
$time\
$character\
"""

[character]
success_symbol = "[❯ ](bold #E06C75) "
error_symbol = "[❯ ](bold #ef5350) "

[env_var.ADMIN]
variable = "STARSHIP_IS_ADMIN"
style = "bold #B5B50D"
format = "[  ]($style) "

[directory]
format = "[$path ](fg:#61AFEF) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[ $branch](bold #F3C267)"

[git_status]
format = "([$all_status$ahead_behind](bold #F3C267)) "
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[status]
format = "[$symbol ](fg:#C94A16)"
symbol = "❌"
disabled = false

[time]
format = "[ $time ](bold #E5C07B)"
disabled = false
time_format = "%H:%M:%S"
