# =====================================================================
# Nirmana-Shell - Transpiled Theme: amro
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$username\
$directory\
$git_branch\
$git_status\
$line_break\
$sudo\
$character\
"""

[username]
format = "[$user](fg:#45F1C2) "
show_always = true

[directory]
format = "[ $path](fg:#0CA0D8) "
truncation_length = 3
truncation_symbol = "…/"

[git_status]
format = "([$all_status$ahead_behind](red) )"
modified = " ✎"
staged = " "

[git_branch]
format = "[ $branch](#14A5AE) "

[sudo]
disabled = false
symbol = "⚡ "
format = "[⚡ ](#cd5e42) "

[character]
success_symbol = "[# ](bold #CD4277) "
error_symbol = "[# ](bold #ef5350) "
