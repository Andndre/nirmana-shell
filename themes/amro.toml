# =====================================================================
# Nirmana-Shell - Transpiled Theme: amro
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler v3.1
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$username\
$directory\
$git_branch\
$git_status\
$line_break\
${env_var.ADMIN}\
$character\
"""

[character]
success_symbol = "[# ](bold #CD4277) "
error_symbol = "[# ](bold #ef5350) "

[username]
format = "[ $user ](bold #45F1C2)"
show_always = true

[directory]
format = "[$path ](fg:#0CA0D8) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[on ](fg:#ffffff)[ $branch](bold #14A5AE)"

[git_status]
format = "([$all_status$ahead_behind](bold #14A5AE)) "
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[env_var.ADMIN]
variable = "STARSHIP_IS_ADMIN"
style = "bold #cd5e42"
format = "[ ⚡ ]($style) "
