# =====================================================================
# Nirmana-Shell - Transpiled Theme: amro
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$username\
$directory\
$git_branch\
$git_status\
$line_break\
$sudo\
$character\
"""

[username]
show_always = true
format = "[ ](#ff70a6)[$user](#45F1C2)[ on](white) "

[directory]
format = "[ $path](#0CA0D8) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[ $branch](#14A5AE)"

[git_status]
format = "([$all_status$ahead_behind](#14A5AE)[](fg:#14A5AE) )"
modified = " "
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[sudo]
disabled = false
symbol = "⚡ "
format = "[⚡ ](#cd5e42)"

[character]
success_symbol = "[❯](bold green) "
error_symbol = "[❯](bold red) "
