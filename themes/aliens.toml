# =====================================================================
# Nirmana-Shell - Transpiled Theme: aliens
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler v3.1
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = false

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$python\
$character\
"""

[character]
format = "$symbol"
success_symbol = ""
error_symbol = ""

[username]
format = "[](fg:#61AFEF)[ $user](fg:#ffffff bg:#61AFEF)"
show_always = true

[hostname]
format = "[@$hostname ](fg:#ffffff bg:#61AFEF)[](fg:#61AFEF)"
ssh_only = false

[directory]
format = "[](fg:#C678DD inverted)[ $path ](fg:#ffffff bg:#C678DD)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[](fg:prev_bg bg:#95ffa4)[  $branch ](fg:#193549 bg:#95ffa4)"

[git_status]
format = "([$all_status$ahead_behind ](fg:#193549 bg:#95ffa4))[](fg:#95ffa4)"
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[python]
format = "[](fg:#FF6471 inverted)[ ${virtualenv} $version ](fg:#ffffff bg:#FF6471)[](fg:#FF6471) "
version_format = "${raw}"
