# =====================================================================
# Nirmana-Shell - Transpiled Theme: jandedobbeleer-accessible
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = false

format = """
$username\
$directory\
$git_branch\
$git_status\
$nodejs\
$golang\
$julia\
$python\
$ruby\
$cmd_duration\
$character\
$fill\
$shell\
$battery\
$time\
"""

[fill]
symbol = " "

[username]
format = "[$user ](fg:#ffffff bg:#c386f1)"
show_always = true

[directory]
format = "[|](fg:#c386f1 bg:#ff479c)[  $path ](fg:#ffffff bg:#ff479c)"
truncation_length = 3
truncation_symbol = "…/"

[git_status]
format = "([$all_status$ahead_behind ](fg:#193549 bg:#fffb38))"
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[git_branch]
format = "[|](fg:#ff479c bg:#fffb38)[  $branch](fg:#193549 bg:#fffb38)"

[nodejs]
format = "[|](fg:#fffb38 bg:#6CA35E)[ 󰎙 $version ](fg:#ffffff bg:#6CA35E)"

[golang]
format = "[|](fg:#6CA35E bg:#8ED1F7)[  $version ](fg:#111111 bg:#8ED1F7)"

[julia]
format = "[|](fg:#8ED1F7 bg:#4063D8)[  $version ](fg:#111111 bg:#4063D8)"

[python]
format = "[|](fg:#4063D8 bg:#FFDE57)[ 󰌠 $version ](fg:#111111 bg:#FFDE57)"

[ruby]
format = "[|](fg:#FFDE57 bg:#AE1401)[  $version ](fg:#ffffff bg:#AE1401)"

[cmd_duration]
format = "[|](fg:#AE1401 bg:#83769c)[  $duration ](fg:#ffffff bg:#83769c)[](fg:#83769c) "
min_time = 1

[shell]
format = "[](fg:#0077c2)[  $version ](fg:#ffffff bg:#0077c2)"

[battery]
format = "[](fg:#f36943 bg:#0077c2)[ 󰁹 $percentage ](fg:#ffffff bg:#f36943)"
disabled = false

[time]
format = "[](fg:#2e9599 bg:#f36943)[  $time ](fg:#111111 bg:#2e9599)"
disabled = false
time_format = "%H:%M:%S"

[character]
success_symbol = ""
error_symbol = ""
