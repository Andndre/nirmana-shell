# =====================================================================
# Nirmana-Shell - Transpiled Theme: gmay
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$username\
$directory\
$time\
$git_branch\
$git_status\
$nodejs\
$line_break\
$character\
"""

[username]
format = "[](fg:#3A86FF)[$user ](fg:#ffffff bg:#3A86FF)"
show_always = true

[directory]
format = "[](fg:#3A86FF bg:#ff479c)[  $path ](fg:#ffffff bg:#ff479c)"
truncation_length = 3
truncation_symbol = "…/"

[time]
format = "[](fg:#ff479c bg:#4caf50)[  $time ](fg:#193549 bg:#4caf50)"
disabled = false
time_format = "%Y-%m-%d %H:%M:%S"

[git_status]
format = "([$all_status$ahead_behind ](fg:#193549 bg:#fffb38))"
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[git_branch]
format = "[](fg:#4caf50 bg:#fffb38)[  $branch](fg:#193549 bg:#fffb38)"

[nodejs]
format = "[](fg:#fffb38 bg:#6CA35E)[ 󰎙 $version ](fg:#ffffff bg:#6CA35E)[](fg:#6CA35E) "

[character]
success_symbol = "[ ](bold #f1184c) "
error_symbol = "[ ](bold #ef5350) "
