# =====================================================================
# Nirmana-Shell - Transpiled Theme: gmay
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler v3.1
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$nodejs\
${env_var.ADMIN}\
$status\
$line_break\
$character\
"""

[character]
success_symbol = "[ ](bold #f1184c) "
error_symbol = "[ ](bold #ef5350) "

[os]
disabled = false
style = "fg:#ffffff bg:#3A86FF"
format = "[](fg:#3A86FF)[ $symbol ]($style)"

[os.symbols]
Windows = "󰕮"
Ubuntu = ""
Macos = ""
Linux = ""

[username]
format = "[ ](fg:#ffffff bg:#3A86FF)[ $user](fg:#ffffff bg:#3A86FF)"
show_always = true

[hostname]
format = "[[@](bold #ffffff)$hostname ](fg:#ffffff bg:#3A86FF)"
ssh_only = false

[directory]
format = "[](fg:prev_bg bg:#ff479c)[  $path ](fg:#ffffff bg:#ff479c)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[](fg:prev_bg bg:#fffb38)[  $branch ](fg:#193549 bg:#fffb38)"

[git_status]
format = "([$all_status$ahead_behind ](fg:#193549 bg:#fffb38))"
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[nodejs]
format = "[](fg:prev_bg bg:#6CA35E)[  $version ](fg:#ffffff bg:#6CA35E)"

[env_var.ADMIN]
variable = "STARSHIP_IS_ADMIN"
style = "fg:#193549 bg:#ffff66"
format = "[](fg:prev_bg bg:#ffff66)[ ⚡ ]($style)[](fg:#ffff66)"

[status]
format = "[](fg:#2e9599 inverted)[ $symbol ](fg:#ffffff bg:#2e9599)[](fg:#2e9599) "
disabled = false
symbol = "❌"
success_symbol = ""
