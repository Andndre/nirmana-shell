# =====================================================================
# Nirmana-Shell - Transpiled Theme: multiverse-neon
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler v3.1
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$status\
$fill\
$nodejs\
$crystal\
$ruby\
$python\
$line_break\
$character\
"""

[fill]
symbol = " "

[character]
success_symbol = "[➔  ](bold #63F08C) "
error_symbol = "[➔  ](bold #ef5350) "

[directory]
format = "[](fg:#29315A)[  $path ](fg:#3EC669 bg:#29315A)[](fg:#29315A) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[](fg:#29315A)[  $branch ](fg:#43CCEA bg:#29315A)"

[git_status]
format = "([$all_status$ahead_behind ](fg:#43CCEA bg:#29315A))[](fg:#29315A) "
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[status]
format = "[$symbol ](fg:#C94A16)"
symbol = "❌"
disabled = false

[nodejs]
format = "[](fg:#303030)[  $version ](fg:#88e570 bg:#303030)[](fg:#303030) "

[crystal]
format = "[](fg:#303030)[  $version ](fg:#4063D8 bg:#303030)[](fg:#303030) "

[ruby]
format = "[](fg:#303030)[  $version ](fg:#DE3F24 bg:#303030)[](fg:#303030) "

[python]
format = "[](fg:#303030)[ 󰌠 $version ](fg:#FED142 bg:#303030)[](fg:#303030) "
