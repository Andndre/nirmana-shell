# =====================================================================
# Nirmana-Shell - Transpiled Theme: multiverse-neon
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$fill\
$nodejs\
$ruby\
$python\
$line_break\
$character\
"""

[fill]
symbol = " "

[directory]
format = "[](fg:#29315A)[  $path ](fg:#3EC669 bg:#29315A)"
truncation_length = 3
truncation_symbol = "…/"

[git_status]
format = "([$all_status$ahead_behind ](fg:#43CCEA bg:#29315A))[](fg:#29315A) "
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[git_branch]
format = "[  $branch](fg:#43CCEA bg:#29315A)"

[nodejs]
format = "[ 󰎙 $version ](fg:#88e570)"

[ruby]
format = "[  $version ](fg:#DE3F24)"

[python]
format = "[ 󰌠 $version ](fg:#FED142)"

[character]
success_symbol = "[➜ ](bold #63F08C) "
error_symbol = "[➜ ](bold #ef5350) "
