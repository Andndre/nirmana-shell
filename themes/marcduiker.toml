# =====================================================================
# Nirmana-Shell - Transpiled Theme: marcduiker
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = false

format = """
$directory\
$git_branch\
$git_status\
$character\
"""

[directory]
format = "[](fg:#feae34)[  $path ](fg:#262b44 bg:#feae34)"
truncation_length = 3
truncation_symbol = "…/"

[git_status]
format = "([$all_status$ahead_behind ](fg:#262b44 bg:#fee761))[](fg:#fee761) "
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[git_branch]
format = "[](fg:#feae34 bg:#fee761)[  $branch](fg:#262b44 bg:#fee761)"

[character]
success_symbol = ""
error_symbol = ""
