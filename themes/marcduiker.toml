# =====================================================================
# Nirmana-Shell - Transpiled Theme: marcduiker
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler v3.1
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = false

format = """
$directory\
$git_branch\
$git_status\
$status\
$character\
"""

[character]
format = "$symbol"
success_symbol = ""
error_symbol = ""

[directory]
format = "[](fg:#feae34)[  $path ](fg:#262b44 bg:#feae34)[](fg:#feae34)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[](fg:#fee761 inverted)[  $branch ](fg:#262b44 bg:#fee761)"

[git_status]
format = "([$all_status$ahead_behind ](fg:#262b44 bg:#fee761))[](fg:#fee761)"
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[status]
format = "[](fg:#0095e9 inverted)[ $symbol ](fg:#ffffff bg:#0095e9)[](fg:#0095e9) "
disabled = false
symbol = "❌"
success_symbol = ""
