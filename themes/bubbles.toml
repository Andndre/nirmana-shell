# =====================================================================
# Nirmana-Shell - Transpiled Theme: bubbles
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler v3.1
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$username\
$directory\
$git_branch\
$git_status\
$fill\
$python\
$golang\
$nodejs\
$ruby\
$java\
$julia\
$battery\
$line_break\
$cmd_duration\
$character\
"""

[fill]
symbol = " "

[character]
format = "$symbol"
success_symbol = "[](fg:#29315A)[ ❯ ](bold #7FD5EA bg:#29315A)[](fg:#29315A) "
error_symbol = "[](fg:#29315A)[ ❯ ](bold #ef5350 bg:#29315A)[](fg:#29315A) "

[username]
format = "[](fg:#29315A)[ $user ](fg:#E64747 bg:#29315A)[](fg:#29315A) "
show_always = true

[directory]
format = "[](fg:#29315A)[  $path ](fg:#3EC669 bg:#29315A)[](fg:#29315A) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[](fg:#29315A)[  $branch ](fg:#43CCEA bg:#29315A)"

[git_status]
format = "([$all_status$ahead_behind ](fg:#43CCEA bg:#29315A))[](fg:#29315A) "
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[python]
format = "[](fg:#29315A)[ 󰌠 $version ](fg:#E4F34A bg:#29315A)[](fg:#29315A) "

[golang]
format = "[](fg:#29315A)[  $version ](fg:#7FD5EA bg:#29315A)[](fg:#29315A) "

[nodejs]
format = "[](fg:#29315A)[ 󰎙 $version ](fg:#42E66C bg:#29315A)[](fg:#29315A) "

[ruby]
format = "[](fg:#29315A)[  $version ](fg:#E64747 bg:#29315A)[](fg:#29315A) "

[java]
format = "[](fg:#29315A)[  $version ](fg:#E64747 bg:#29315A)[](fg:#29315A) "

[julia]
format = "[](fg:#29315A)[  $version ](fg:#9B6BDF bg:#29315A)[](fg:#29315A) "

[battery]
format = "[](fg:#29315A)[ 󰁹 $percentage ](fg:#9B6BDF bg:#29315A)[](fg:#29315A) "

[cmd_duration]
format = "[](fg:#29315A)[ $duration ](fg:#AEA4BF bg:#29315A)[](fg:#29315A) "
min_time = 150
