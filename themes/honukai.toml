# =====================================================================
# Nirmana-Shell - Transpiled Theme: honukai
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler v3.1
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$fill\
$nodejs\
$python\
$golang\
$rust\
$php\
$package\
$time\
$line_break\
${env_var.ADMIN}\
$python\
$status\
$character\
"""

[fill]
symbol = " "

[character]
success_symbol = "[➔  ](bold #CC4B16) "
error_symbol = "[➔  ](bold #ef5350) "

[username]
format = "[$user ](bold #FFFFFF)"
show_always = true

[hostname]
format = "[@$hostname ](bold #FFFFFF) "
ssh_only = true

[directory]
format = "[$path ](fg:#0973C0) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[on ](fg:#ffffff)[ $branch](bold #B8B80A)"

[git_status]
format = "([$all_status$ahead_behind](bold #B8B80A)) "
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[nodejs]
format = "[ 󰎙 $version ](bold #80D166)"

[python]
format = "[󰌠 $version ](bold #100e23) "

[golang]
format = "[  $version ](bold #06AAD5)"

[rust]
format = "[  $version ](bold #F78C6C)"

[php]
format = "[  $version ](bold #787CB5)"

[package]
format = "[ 󰏗 $version ](bold #AEA4BF)"

[time]
format = "[ $time ](bold #ffffff)"
disabled = false
time_format = "%H:%M:%S"

[env_var.ADMIN]
variable = "STARSHIP_IS_ADMIN"
style = "bold #CECE04"
format = "[  ]($style) "

[status]
format = "[$symbol ](fg:#CB4B16)"
symbol = "❌"
disabled = false
