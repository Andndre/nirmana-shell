# =====================================================================
# Nirmana-Shell - Transpiled Theme: honukai
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$username\
$directory\
$git_branch\
$git_status\
$fill\
$python\
$time\
$line_break\
$sudo\
$character\
"""

[fill]
symbol = " "

[username]
show_always = true
format = "[ ](#ff70a6)[$user](#FFFFFF) "

[directory]
format = "[ $path](#0973C0) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[ $branch](#B8B80A)"

[git_status]
format = "([$all_status$ahead_behind](#B8B80A) )"
modified = " "
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[time]
disabled = false
time_format = "%H:%M:%S"
format = "[ $time](#ffffff) "

[sudo]
disabled = false
symbol = " "
format = "[ ](#CECE04) "

[python]
symbol = "󰌠 "
format = "[󰌠 $version](#100e23) "

[character]
success_symbol = "[❯ ](bold #CB4B16) "
error_symbol = "[❯ ](bold #ef5350) "
