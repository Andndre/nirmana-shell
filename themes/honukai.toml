# =====================================================================
# Nirmana-Shell - Transpiled Theme: honukai
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$username\
$directory\
$git_branch\
$git_status\
$fill\
$time\
$line_break\
$sudo\
$character\
"""

[fill]
symbol = " "

[username]
format = "[$user](fg:#FFFFFF) "
show_always = true

[directory]
format = "[ $path](fg:#0973C0) "
truncation_length = 3
truncation_symbol = "…/"

[git_status]
format = "([$all_status$ahead_behind](red) )"
modified = " ✎"
staged = " "

[git_branch]
format = "[ $branch](#B8B80A) "

[time]
format = "[  $time ](fg:#ffffff)"
disabled = false
time_format = "%H:%M:%S"

[sudo]
disabled = false
symbol = " "
format = "[ ](#CECE04) "

[character]
success_symbol = "[➜ ](bold #CC4B16) "
error_symbol = "[➜ ](bold #ef5350) "
