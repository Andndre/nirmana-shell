# =====================================================================
# Nirmana-Shell - Transpiled Theme: plague
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$username\
$directory\
$git_branch\
$git_status\
$fill\
$nodejs\
$shell\
$line_break\
$sudo\
$character\
"""

[fill]
symbol = " "

[username]
show_always = true
format = "[](fg:#333333)[$user](fg:#ff0000 bg:#333333)[](fg:#333333) "

[directory]
format = "[ $path](fg:#000000 bg:#ff0000)[](fg:#ff0000) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[](fg:#fffb38)[ $branch](fg:#193549 bg:#fffb38)"

[git_status]
format = "([$all_status$ahead_behind](fg:#193549 bg:#fffb38)[](fg:#fffb38) )"
modified = " "
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[nodejs]
symbol = "󰎙 "
format = "[󰎙 $version](fg:#ffffff bg:#6CA35E)[](fg:#6CA35E) "

[shell]
disabled = false
format = "[ $indicator](fg:#ffffff bg:#203248)[](fg:#203248) "

[sudo]
disabled = false
symbol = " "
format = "[ ](#ffffff) "

[character]
success_symbol = "[ ](bold #ffffff) "
error_symbol = "[ ](bold #ef5350) "
