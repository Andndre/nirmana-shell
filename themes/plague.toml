# =====================================================================
# Nirmana-Shell - Transpiled Theme: plague
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler v3.1
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = false

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$nodejs\
$shell\
${env_var.ADMIN}\
$status\
$character\
"""

[character]
format = "$symbol"
success_symbol = "[](fg:prev_bg) "
error_symbol = "[](fg:prev_bg) "

[username]
format = "[](fg:#333333)[ $user](fg:#ff0000 bg:#333333)"
show_always = true

[hostname]
format = "[[@](bold #ff0000)$hostname ](fg:#ff0000 bg:#333333)[](fg:#333333)"
ssh_only = false

[directory]
format = "[](fg:#ff0000 inverted)[  $path ](fg:#000000 bg:#ff0000)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[](fg:prev_bg bg:#fffb38)[  $branch ](fg:#193549 bg:#fffb38)"

[git_status]
format = "([$all_status$ahead_behind ](fg:#193549 bg:#fffb38))"
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[nodejs]
format = "[](fg:prev_bg bg:#6CA35E)[  $version ](fg:#ffffff bg:#6CA35E)"

[shell]
disabled = false
powershell_indicator = "pwsh"
bash_indicator = "bash"
zsh_indicator = "zsh"
style = "fg:#ffffff bg:#203248"
format = "[](fg:prev_bg bg:#203248)[  $indicator ]($style)"

[env_var.ADMIN]
variable = "STARSHIP_IS_ADMIN"
style = "fg:#ffffff bg:#ffff66"
format = "[](fg:prev_bg bg:#ffff66)[ ⚡ ]($style)[](fg:#ffff66)"

[status]
format = "[](fg:#2e9599 inverted)[ $symbol ](fg:#ffffff bg:#2e9599)"
disabled = false
symbol = "❌"
success_symbol = ""
