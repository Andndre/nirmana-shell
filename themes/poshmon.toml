# =====================================================================
# Nirmana-Shell - Transpiled Theme: poshmon
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$username\
$directory\
$git_branch\
$git_status\
$fill\
$nodejs\
$python\
$golang\
$time\
$line_break\
$character\
"""

[fill]
symbol = " "

[username]
format = "[](fg:#2e9599)[$user ](fg:#ffffff bg:#2e9599)"
show_always = true

[directory]
format = "[](fg:#2e9599 bg:#D51111)[  $path ](fg:#ffffff bg:#D51111)"
truncation_length = 3
truncation_symbol = "…/"

[git_status]
format = "([$all_status$ahead_behind ](fg:#000000 bg:#c19c00))[](fg:#c19c00) "
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[git_branch]
format = "[](fg:#D51111 bg:#c19c00)[  $branch](fg:#000000 bg:#c19c00)"

[nodejs]
format = "[](fg:#303030)[ 󰎙 $version ](fg:#3C873A bg:#303030)"

[python]
format = "[](fg:#306998 bg:#303030)[ 󰌠 $version ](fg:#FFE873 bg:#306998)"

[golang]
format = "[](fg:#ffffff bg:#306998)[  $version ](fg:#06aad5 bg:#ffffff)"

[time]
format = "[](fg:#2e9599 bg:#ffffff)[  $time ](fg:#ffffff bg:#2e9599)"
disabled = false
time_format = "_2, %H:%M:%S"

[character]
success_symbol = "[ ](bold #FFFFFF) "
error_symbol = "[ ](bold #D51111) "
