# =====================================================================
# Nirmana-Shell - Transpiled Theme: nu4a
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = false

format = """
$username\
$directory\
$git_branch\
$git_status\
$python\
$character\
$fill\
$cmd_duration\
"""

[fill]
symbol = " "

[username]
format = "[$user ](fg:#100e23 bg:#cfcfc4)"
show_always = true

[directory]
format = "[](fg:#cfcfc4 bg:#ec9706)[  $path ](fg:#100e23 bg:#ec9706)"
truncation_length = 3
truncation_symbol = "…/"

[git_status]
format = "([$all_status$ahead_behind ](fg:#193549 bg:#3feb56))"
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[git_branch]
format = "[](fg:#ec9706 bg:#3feb56)[  $branch](fg:#193549 bg:#3feb56)"

[python]
format = "[](fg:#3feb56 bg:#906cff)[ 󰌠 $version ](fg:#100e23 bg:#906cff)[](fg:#906cff) "

[cmd_duration]
format = "[](fg:#2f2f2f)[  $duration ](fg:#fafafa bg:#2f2f2f)"

[character]
success_symbol = ""
error_symbol = ""
