# =====================================================================
# Nirmana-Shell - Transpiled Theme: nu4a
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$username\
$directory\
$git_branch\
$git_status\
$python\
$fill\
$character\
$cmd_duration\
$line_break\
$character\
"""

[fill]
symbol = " "

[username]
show_always = true
format = "[](fg:#cfcfc4)[ $user](fg:#100e23 bg:#cfcfc4)[](fg:#cfcfc4) "

[directory]
format = "[](fg:#ec9706)[ $path](fg:#100e23 bg:#ec9706)[](fg:#ec9706) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[](fg:#3feb56)[ $branch](fg:#193549 bg:#3feb56)"

[git_status]
format = "([$all_status$ahead_behind](fg:#193549 bg:#3feb56)[](fg:#3feb56) )"
modified = " "
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[python]
symbol = "󰌠 "
format = "[](fg:#906cff)[󰌠 $version](fg:#100e23 bg:#906cff)[](fg:#906cff) "

[character]
success_symbol = "[❯ ](bold #ffffff) "
error_symbol = "[❯ ](bold #ef5350) "

[cmd_duration]
min_time = 1
format = "[ $duration](fg:#fafafa bg:#2f2f2f) "
