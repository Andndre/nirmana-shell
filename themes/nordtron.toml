# =====================================================================
# Nirmana-Shell - Transpiled Theme: nordtron
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$directory\
$username\
$git_branch\
$git_status\
$line_break\
$character\
"""

[directory]
format = "[ $path](fg:cyan) "
truncation_length = 3
truncation_symbol = "…/"

[username]
format = "[$user](fg:#88c0d0) "
show_always = true

[git_status]
format = "([$all_status$ahead_behind](red) )"
modified = " ✎"
staged = " "

[git_branch]
format = "[ $branch](#b48ead) "

[character]
success_symbol = "[ ](bold #5e81ac) "
error_symbol = "[ ](bold #ef5350) "
