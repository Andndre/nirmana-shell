# =====================================================================
# Nirmana-Shell - Transpiled Theme: ys
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$python\
$line_break\
$sudo\
$character\
"""

[directory]
format = "[ $path](fg:cyan) "
truncation_length = 3
truncation_symbol = "…/"

[git_status]
format = "([$all_status$ahead_behind](red) )"
modified = " ✎"
staged = " "

[git_branch]
format = "[ $branch](purple) "

[python]
format = "[󰌠 $version](fg:#FFFFFF) "

[sudo]
disabled = false
symbol = "⚡ "
format = "[⚡ ](#FF5252) "

[character]
success_symbol = "[\\$ ](bold #FF8A80) "
error_symbol = "[\\$ ](bold #ef5350) "
