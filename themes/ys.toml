# =====================================================================
# Nirmana-Shell - Transpiled Theme: ys
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler v3.1
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$python\
$line_break\
${env_var.ADMIN}\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$status\
$line_break\
$character\
"""

[character]
success_symbol = "[\\\\$ ](bold #FF8A80) "
error_symbol = "[\\\\$ ](bold #ef5350) "

[python]
format = "[󰌠 $version ](bold #FFFFFF) "

[env_var.ADMIN]
variable = "STARSHIP_IS_ADMIN"
style = "bold #FF5252"
format = "[ ⚡ ]($style) "

[username]
format = "[$user ](bold #43CCEA)"
show_always = true

[hostname]
format = "[@$hostname ](bold #43CCEA) "
ssh_only = true

[directory]
format = "[$path ](fg:#FFF59D) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[on ](fg:darkGray)[ $branch](bold #addb67)"

[git_status]
format = "([$all_status$ahead_behind](bold #addb67)) "
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[status]
format = "[$symbol ](fg:#FF5252)"
symbol = "❌"
disabled = false
