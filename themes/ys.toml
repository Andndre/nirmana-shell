# =====================================================================
# Nirmana-Shell - Transpiled Theme: ys
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$username\
$directory\
$git_branch\
$git_status\
$fill\
$python\
$time\
$line_break\
$sudo\
$character\
"""

[fill]
symbol = " "

[python]
symbol = "󰌠 "
format = "[󰌠 $version](white) "

[character]
success_symbol = "[\\$ ](bold lightRed) "
error_symbol = "[\\$ ](bold #ef5350) "

[sudo]
disabled = false
symbol = "⚡ "
format = "[⚡ ](red) "

[username]
show_always = true
format = "[ ](#ff70a6)[$user](yellow) "

[directory]
format = "[ $path](lightYellow) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[ $branch](purple)"

[git_status]
format = "([$all_status$ahead_behind](purple) )"
modified = " "
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[time]
disabled = false
time_format = "%H:%M:%S"
format = "[ $time](darkGray) "
