# =====================================================================
# Nirmana-Shell - Transpiled Theme: rudolfs-light
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$sudo\
$username\
$git_branch\
$git_status\
$directory\
$python\
$line_break\
$character\
"""

[sudo]
disabled = false
symbol = " "
format = "[ ](#BF231D)"

[username]
show_always = true
format = "[](fg:#E0E0E0)[ $user](fg:#424242 bg:#E0E0E0)[](fg:#E0E0E0) "

[git_branch]
format = "[](fg:#E0E0E0)[ $branch](fg:#424242 bg:#E0E0E0)"

[git_status]
format = "([$all_status$ahead_behind](fg:#424242 bg:#E0E0E0)[](fg:#E0E0E0) )"
modified = " "
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[directory]
format = "[](fg:#E0E0E0)[ $path](fg:#424242 bg:#E0E0E0)[](fg:#E0E0E0) "
truncation_length = 3
truncation_symbol = "…/"

[python]
symbol = "󰌠 "
format = "[](fg:#E0E0E0)[󰌠 $version](fg:#424242 bg:#E0E0E0)[](fg:#E0E0E0) "

[character]
success_symbol = "[❯](bold green) "
error_symbol = "[❯](bold red) "
