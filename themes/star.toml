# =====================================================================
# Nirmana-Shell - Transpiled Theme: star
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$fill\
$nodejs\
$line_break\
$sudo\
$character\
"""

[fill]
symbol = " "

[sudo]
disabled = false
symbol = "⚡ "
format = "[⚡ ](#E06C75) "

[directory]
format = "[ $path](#55B9C4) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[ $branch](#C678DD)"

[git_status]
format = "([$all_status$ahead_behind](#C678DD) )"
modified = " "
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[nodejs]
symbol = "󰎙 "
format = "[󰎙 $version](#98C379) "

[character]
success_symbol = "[❯ ](bold #C94A16) "
error_symbol = "[❯ ](bold #ef5350) "
