# =====================================================================
# Nirmana-Shell - Transpiled Theme: fish
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler v3.1
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = false

format = """
$status\
${env_var.ADMIN}\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$character\
"""

[character]
format = "$symbol"
success_symbol = ""
error_symbol = ""

[status]
format = "[$symbol ](fg:#ffffff)"
symbol = "❌"
disabled = false

[env_var.ADMIN]
variable = "STARSHIP_IS_ADMIN"
style = "bold #100e23"
format = "[  ]($style) "

[username]
format = "[$user ](bold #ffffff)"
show_always = true

[hostname]
format = "[@$hostname ](bold #ffffff) "
ssh_only = true

[directory]
format = "[](fg:#007ACC inverted)[ $path ](fg:#ffffff bg:#007ACC)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[  $branch ](fg:#ffffff bg:#007ACC)"

[git_status]
format = "([$all_status$ahead_behind ](fg:#ffffff bg:#007ACC))"
modified = " ~${count}"
staged = " +${count}"
stashed = " *${count}"
ahead = " ↑${count}"
behind = " ↓${count}"
diverged = " ↕↑${ahead_count}↓${behind_count}"
deleted = " -${count}"
