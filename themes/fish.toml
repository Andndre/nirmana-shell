# =====================================================================
# Nirmana-Shell - Transpiled Theme: fish
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$character\
$sudo\
$username\
$directory\
$git_branch\
$git_status\
$line_break\
$character\
"""

[character]
success_symbol = "[❯ ](bold #ffffff) "
error_symbol = "[❯ ](bold #ef5350) "

[sudo]
disabled = false
symbol = " "
format = "[ ](#100e23)"

[username]
show_always = true
format = "[ ](#ff70a6)[$user](#ffffff) "

[directory]
format = "[](fg:#007ACC)[ $path](fg:#ffffff bg:#007ACC)[](fg:#007ACC) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[](fg:#007ACC)[ $branch](fg:#ffffff bg:#007ACC)"

[git_status]
format = "([$all_status$ahead_behind](fg:#ffffff bg:#007ACC)[](fg:#007ACC) )"
modified = " "
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"
