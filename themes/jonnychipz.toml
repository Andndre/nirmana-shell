# =====================================================================
# Nirmana-Shell - Transpiled Theme: jonnychipz
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler v3.1
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$username\
$hostname\
$azure\
$status\
$line_break\
$os\
${env_var.ADMIN}\
$directory\
$git_branch\
$git_status\
$terraform\
$character\
"""

[character]
success_symbol = "[❯ ](bold #1a1af5) "
error_symbol = "[❯ ](bold #ef5350) "

[username]
format = "[](fg:#4707a8)[ $user](fg:#ffffff bg:#4707a8)"
show_always = true

[hostname]
format = "[[@](bold #ffffff)$hostname ](fg:#ffffff bg:#4707a8)[](fg:#4707a8)"
ssh_only = false

[azure]
format = "[](fg:#1a1af5 inverted)[  $subscription ](fg:#ffffff bg:#1a1af5)[](fg:#1a1af5)"
disabled = false

[status]
format = "[](fg:#4707a8 inverted)[ $symbol ](fg:#ffffff bg:#4707a8)[](fg:#4707a8) "
disabled = false
symbol = "❌"
success_symbol = ""

[os]
disabled = false
style = "fg:#000000 bg:#ffffff"
format = "[](fg:#ffffff)[ $symbol ]($style)[ ](fg:#000000 bg:#ffffff)"

[os.symbols]
Windows = "󰕮"
Ubuntu = ""
Macos = ""
Linux = ""

[env_var.ADMIN]
variable = "STARSHIP_IS_ADMIN"
style = "fg:#ffffff bg:#000000"
format = "[](fg:prev_bg bg:#000000)[ ⚡ ]($style)"

[directory]
format = "[](fg:prev_bg bg:#ffffff)[  $path ](fg:#000000 bg:#ffffff)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[  $branch ](fg:#000000 bg:#ffffff)"

[git_status]
format = "([$all_status$ahead_behind ](fg:#000000 bg:#ffffff))"
modified = " ~${count}"
staged = " +${count}"
stashed = " *${count}"
ahead = " ↑${count}"
behind = " ↓${count}"
diverged = " ↕↑${ahead_count}↓${behind_count}"
deleted = " -${count}"

[terraform]
format = "[ ](fg:#000000 bg:#ffffff)[ 󱁢 $workspace ](fg:#000000 bg:#ffffff)"
disabled = false
