# =====================================================================
# Nirmana-Shell - Transpiled Theme: cert
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$username\
$directory\
$git_branch\
$git_status\
$fill\
$time\
$line_break\
$character\
"""

[fill]
symbol = " "

[username]
show_always = true
format = "[](fg:#E36464)[$user](fg:#ffffff bg:#E36464)[](fg:#E36464) "

[directory]
format = "[](fg:green)[ $path](fg:#ffffff bg:green)[](fg:green) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[](fg:lightCyan)[ $branch](fg:#ffffff bg:lightCyan)"

[git_status]
format = "([$all_status$ahead_behind](fg:#ffffff bg:lightCyan)[](fg:lightCyan) )"
modified = " "
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[time]
disabled = false
time_format = "%H:%M"
format = "[](fg:lightMagenta)[ $time](fg:#ffffff bg:lightMagenta)[](fg:lightMagenta) "

[character]
success_symbol = "[❯](bold green) "
error_symbol = "[❯](bold red) "
