# =====================================================================
# Nirmana-Shell - Transpiled Theme: cert
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$username\
$directory\
$git_branch\
$git_status\
$time\
$line_break\
$character\
"""

[username]
show_always = true
format = "[$user](fg:#fff bg:#E36464) "

[directory]
format = "[ $path](fg:#fff bg:green) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[$branch](fg:#fff bg:lightCyan)"

[git_status]
format = "([$all_status$ahead_behind](fg:#fff bg:lightCyan))"
modified = " "
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[time]
disabled = false
time_format = "%H:%M"
format = "[$time](fg:#fff bg:lightMagenta) "

[character]
success_symbol = "[❯](bold green) "
error_symbol = "[❯](bold red) "
