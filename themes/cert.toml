# =====================================================================
# Nirmana-Shell - Transpiled Theme: cert
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler v3.1
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = false

format = """
$username\
$directory\
$git_branch\
$git_status\
$character\
"""

[character]
format = "$symbol"
success_symbol = ""
error_symbol = ""

[username]
format = "[](fg:#E36464)[ $user ](fg:#ffffff bg:#E36464)[](fg:#E36464) "
show_always = true

[directory]
format = "[](fg:#69F0AE)[ $path ](fg:#ffffff bg:#69F0AE)[](fg:#69F0AE) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[](fg:#80DEEA)[  $branch ](fg:#ffffff bg:#80DEEA)"

[git_status]
format = "([$all_status$ahead_behind ](fg:#ffffff bg:#80DEEA))"
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"
