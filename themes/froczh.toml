# =====================================================================
# Nirmana-Shell - Transpiled Theme: froczh
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$username\
$directory\
$git_branch\
$git_status\
$fill\
$dotnet\
$nodejs\
$cmd_duration\
$time\
$line_break\
$character\
"""

[fill]
symbol = " "

[username]
show_always = true
format = "[$user](fg:#ffffff bg:#40189c)[](fg:#40189c) "

[directory]
format = "[](bg:#01579B)[ $path](fg:#ffffff bg:#01579B)[](fg:#01579B) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[](fg:#00C853)[ $branch](fg:#000000 bg:#00C853)"

[git_status]
format = "([$all_status$ahead_behind](fg:#000000 bg:#00C853)[](fg:#00C853) )"
modified = " "
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[dotnet]
symbol = "󰪮 "
format = "[󰪮 $version](fg:#000000 bg:#00ffff)[](fg:#00ffff) "

[nodejs]
symbol = "󰎙 "
format = "[󰎙 $version](fg:#45bf17 bg:#000000)[](fg:#000000) "

[character]
success_symbol = "[❯ ](bold #ffffff) "
error_symbol = "[❯ ](bold #ff0000) "

[cmd_duration]
min_time = 1
format = "[](fg:#29315A)[ $duration](fg:#ffffff bg:#29315A)[](fg:#29315A) "

[time]
disabled = false
time_format = "%H:%M:%S | %A"
format = "[](fg:#29315A)[ $time](fg:#3EC669 bg:#29315A)[](fg:#29315A) "
