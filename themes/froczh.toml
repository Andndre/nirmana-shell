# =====================================================================
# Nirmana-Shell - Transpiled Theme: froczh
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$username\
$directory\
$git_branch\
$git_status\
$dotnet\
$nodejs\
$fill\
$cmd_duration\
$time\
$line_break\
$character\
"""

[fill]
symbol = " "

[username]
format = "[](fg:#40189c)[$user ](fg:#ffffff bg:#40189c)"
show_always = true

[directory]
format = "[](fg:#40189c bg:#01579B)[  $path ](fg:#ffffff bg:#01579B)"
truncation_length = 3
truncation_symbol = "…/"

[git_status]
format = "([$all_status$ahead_behind ](fg:#000000 bg:#00C853))"
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[git_branch]
format = "[](fg:#01579B bg:#00C853)[  $branch](fg:#000000 bg:#00C853)"

[dotnet]
format = "[](fg:#00C853 bg:#00ffff)[ 󰪮 $version ](fg:#000000 bg:#00ffff)"

[nodejs]
format = "[](fg:#00ffff bg:#000000)[ 󰎙 $version ](fg:#45bf17 bg:#000000)[](fg:#000000) "

[cmd_duration]
format = "[](fg:#29315A)[  $duration ](fg:#ffffff bg:#29315A)"

[time]
format = "[  $time ](fg:#3EC669 bg:#29315A)"
disabled = false
time_format = "%H:%M:%S | %A"

[character]
success_symbol = "[❯ ](bold #ffffff) "
error_symbol = "[❯ ](bold #ff0000) "
