# =====================================================================
# Nirmana-Shell - Transpiled Theme: the-unnamed
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler v3.1
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$nodejs\
$line_break\
$character\
"""

[character]
success_symbol = "[❯ ](bold #FFE45E) "
error_symbol = "[❯ ](bold #ef5350) "

[directory]
format = "[$path ](fg:#15C2CB) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[on ](fg:#F3EFF5)[ $branch](bold #F141A8)"

[git_status]
format = "([$all_status$ahead_behind](bold #F141A8)) "
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[nodejs]
format = "[via ](fg:#F3EFF5)[ $version ](bold #44FFD2) "
