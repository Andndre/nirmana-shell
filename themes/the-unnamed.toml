# =====================================================================
# Nirmana-Shell - Transpiled Theme: the-unnamed
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$fill\
$nodejs\
$line_break\
$character\
"""

[fill]
symbol = " "

[directory]
format = "[ $path](#15C2CB) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[ $branch](#F141A8)"

[git_status]
format = "([$all_status$ahead_behind](#F141A8) )"
modified = " "
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[nodejs]
symbol = "󰎙 "
format = "[󰎙 $version](#44FFD2) "

[character]
success_symbol = "[❯ ](bold #FFE45E) "
error_symbol = "[❯ ](bold #ef5350) "
