# =====================================================================
# Nirmana-Shell - Transpiled Theme: agnoster
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler v3.1
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = false

format = """
${env_var.ADMIN}\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$python\
$status\
$character\
"""

[character]
format = "$symbol"
success_symbol = "[](fg:prev_bg) "
error_symbol = "[](fg:prev_bg) "

[env_var.ADMIN]
variable = "STARSHIP_IS_ADMIN"
style = "fg:#100e23 bg:#ffe9aa"
format = "[ ⚡ ]($style)"

[username]
format = "[](fg:prev_bg bg:#ffffff)[ $user](fg:#100e23 bg:#ffffff)"
show_always = true

[hostname]
format = "[@$hostname ](fg:#100e23 bg:#ffffff)"
ssh_only = false

[directory]
format = "[](fg:prev_bg bg:#91ddff)[ $path ](fg:#100e23 bg:#91ddff)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[](fg:prev_bg bg:#95ffa4)[  $branch ](fg:#193549 bg:#95ffa4)"

[git_status]
format = "([$all_status$ahead_behind ](fg:#193549 bg:#95ffa4))"
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[python]
format = "[](fg:prev_bg bg:#906cff)[ 󰌠 ${virtualenv} $version ](fg:#100e23 bg:#906cff)"
version_format = "${raw}"

[status]
format = "[](fg:prev_bg bg:#ff8080)[ $symbol ](fg:#ffffff bg:#ff8080)[](fg:#ff8080) "
disabled = false
symbol = "❌"
