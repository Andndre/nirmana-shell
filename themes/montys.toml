# =====================================================================
# Nirmana-Shell - Transpiled Theme: montys
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$fill\
$nodejs\
$cmd_duration\
$time\
$line_break\
$sudo\
$character\
"""

[fill]
symbol = " "

[directory]
format = "[ $path](fg:#ffffff bg:#DA627D)[](fg:#DA627D) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[](fg:#FCA17D)[ $branch](fg:#ffffff bg:#FCA17D)"

[git_status]
format = "([$all_status$ahead_behind](fg:#ffffff bg:#FCA17D)[](fg:#FCA17D) )"
modified = " "
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[nodejs]
symbol = "󰎙 "
format = "[󰎙 $version](fg:#ffffff bg:#76b367)[](fg:#76b367) "

[cmd_duration]
min_time = 1
format = "[](fg:#83769c)[ $duration](fg:#ffffff bg:#83769c)[](fg:#83769c) "

[time]
disabled = false
time_format = "%I:%M %p"
format = "[ $time](fg:#ffffff bg:#33658A)[](fg:#33658A) "

[character]
success_symbol = "[❯ ](bold #CD4277) "
error_symbol = "[❯ ](bold #ef5350) "

[sudo]
disabled = false
symbol = "⚡ "
format = "[⚡ ](#cd5e42) "
