# =====================================================================
# Nirmana-Shell - Transpiled Theme: montys
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler v3.1
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$os\
$directory\
$git_branch\
$git_status\
$nodejs\
$cmd_duration\
$status\
$line_break\
${env_var.ADMIN}\
$character\
"""

[character]
success_symbol = "[⚡ ❯❯ ](bold #CD4277) "
error_symbol = "[⚡ ❯❯ ](bold #ef5350) "

[os]
disabled = false
style = "fg:#00c983 bg:#003543"
format = "[](fg:#003543)[ $symbol ]($style)"

[os.symbols]
Windows = "󰕮"
Ubuntu = ""
Macos = ""
Linux = ""

[directory]
format = "[](fg:prev_bg bg:#DA627D)[ $path ](fg:#ffffff bg:#DA627D)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[](fg:prev_bg bg:#FCA17D)[  $branch ](fg:#ffffff bg:#FCA17D)"

[git_status]
format = "([$all_status$ahead_behind ](fg:#ffffff bg:#FCA17D))"
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[nodejs]
format = "[](fg:prev_bg bg:#76b367)[  $version ](fg:#ffffff bg:#76b367)"

[cmd_duration]
format = "[](fg:prev_bg bg:#83769c)[  $duration ](fg:#ffffff bg:#83769c)"
min_time = 0
show_milliseconds = true

[status]
format = "[](fg:prev_bg bg:#2e9599)[ $symbol ](fg:#ffffff bg:#2e9599)[](fg:#2e9599) "
disabled = false
symbol = "❌"
success_symbol = ""

[env_var.ADMIN]
variable = "STARSHIP_IS_ADMIN"
style = "bold #cd5e42"
format = "[ ⚡ ]($style) "
