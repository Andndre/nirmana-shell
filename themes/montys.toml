# =====================================================================
# Nirmana-Shell - Transpiled Theme: montys
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$nodejs\
$cmd_duration\
$time\
$line_break\
$sudo\
$character\
"""

[directory]
format = "[](fg:#DA627D)[  $path ](fg:#ffffff bg:#DA627D)"
truncation_length = 3
truncation_symbol = "…/"

[git_status]
format = "([$all_status$ahead_behind ](fg:#ffffff bg:#FCA17D))"
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[git_branch]
format = "[](fg:#DA627D bg:#FCA17D)[  $branch](fg:#ffffff bg:#FCA17D)"

[nodejs]
format = "[](fg:#FCA17D bg:#76b367)[ 󰎙 $version ](fg:#ffffff bg:#76b367)"

[cmd_duration]
format = "[](fg:#76b367 bg:#83769c)[  $duration ](fg:#ffffff bg:#83769c)"
min_time = 1

[time]
format = "[](fg:#83769c bg:#33658A)[  $time ](fg:#ffffff bg:#33658A)[](fg:#33658A) "
disabled = false
time_format = "%I:%M %p"

[sudo]
disabled = false
symbol = "⚡ "
format = "[⚡ ](#cd5e42) "

[character]
success_symbol = "[⚡ ❯❯ ](bold #CD4277) "
error_symbol = "[⚡ ❯❯ ](bold #ef5350) "
