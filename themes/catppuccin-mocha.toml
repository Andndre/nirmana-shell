# =====================================================================
# Nirmana-Shell - Catppuccin Mocha Theme
# =====================================================================

scan_timeout = 30
add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$php\
$nodejs\
$python\
$cmd_duration\
$line_break\
$character"""

[character]
success_symbol = "[❯](bold #A6E3A1)"
error_symbol = "[❯](bold #F38BA8)"

[directory]
truncation_length = 3
truncation_symbol = "…/"
style = "bold #89DCEB"
read_only = " 󰌾"

[git_branch]
symbol = " "
style = "bold #CBA6F7"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold #F9E2AF"
format = '([\[$all_status$ahead_behind\]]($style) )'

[cmd_duration]
min_time = 2_000
style = "bold #6C7086"
format = "took [$duration]($style) "

[php]
symbol = " "
style = "bold #F5C2E7"
format = "[$symbol($version )]($style)"

[nodejs]
symbol = "󰎙 "
style = "bold #A6E3A1"
format = "[$symbol($version )]($style)"

[python]
symbol = "󰌠 "
style = "bold #F9E2AF"
format = "[$symbol($version )]($style)"

[package]
disabled = true
[battery]
disabled = true
[dotnet]
disabled = true
[aws]
disabled = true
[gcloud]
disabled = true
[azure]
disabled = true
[docker_context]
disabled = true
