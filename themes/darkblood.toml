# =====================================================================
# Nirmana-Shell - Transpiled Theme: darkblood
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$username\
$git_branch\
$git_status\
$sudo\
$character\
$line_break\
$directory\
"""

[username]
show_always = true
format = "[ ](#ff70a6)[$user](#ffffff) "

[git_branch]
format = "[ $branch](#ffffff)"

[git_status]
format = "([$all_status$ahead_behind](#ffffff) )"
modified = " "
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[sudo]
disabled = false
symbol = " "
format = "[ ](#ffffff)"

[character]
success_symbol = "[❯ ](bold #ffffff) "
error_symbol = "[❯ ](bold #ef5350) "

[directory]
format = "[ $path](#ffffff) "
truncation_length = 3
truncation_symbol = "…/"
