# =====================================================================
# Nirmana-Shell - Transpiled Theme: tokyo
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler v3.1
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
[┏](bold #7eb8da)\
$time\
$username\
$hostname\
$memory_usage\
$battery\
$cmd_duration\
$line_break\
[┣](bold #7eb8da)\
$directory\
$git_branch\
$git_status\
$azure\
$aws\
$line_break\
${env_var.ADMIN}\
$status\
$character\
"""

[character]
success_symbol = "[> ](bold #22da6e) "
error_symbol = "[> ](bold #ef5350) "
format = "[└─](bold #7eb8da)$symbol"

[time]
format = "[\\[](bold #7eb8da)[  ](bold #ffffff)[$time](bold #7eb8da)[\\]](bold #7eb8da)"
disabled = false
time_format = "%m/%d/%Y @ %I:%M:%S %p %Z"

[username]
format = "[\\[](bold #7eb8da)[  ](bold #ffffff)[$user ](bold #7eb8da)"
show_always = true

[hostname]
format = "[:: ](bold #ffffff)[ ](bold #ffffff)[$hostname](bold #7eb8da)[\\]](bold #7eb8da)"
ssh_only = false

[memory_usage]
format = "[\\[](bold #be9ddf)[ 󰍛 ](bold #ffffff)[RAM: $ram](bold #be9ddf)[\\]](bold #be9ddf)"
disabled = false
threshold = -1
symbol = ""
style = "bold #be9ddf"

[battery]
format = "[\\[](bold #f36943)[󰁹 $percentage](bold #f36943)[\\]](bold #f36943)"
disabled = false

[[battery.display]]
threshold = 100
style = "bold #f36943"

[cmd_duration]
format = "[\\[](bold #be9ddf)[  ](bold #ffffff)[$duration](bold #be9ddf)[\\]](bold #be9ddf)"
min_time = 0
show_milliseconds = true

[directory]
format = "[\\[](bold #7eb8da)[  ](bold #ffffff)[$path](bold #98bfad)[\\]](bold #7eb8da)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[\\[](bold #ffa5d8)[  ](bold #ffffff)[$branch](bold #ffa5d8)"

[git_status]
format = "([$all_status$ahead_behind](bold #ffa5d8))[\\]](bold #ffa5d8)"
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[azure]
format = "[ $version ](bold #7eb8da) "

[aws]
format = "[ $version ](bold #7eb8da) "

[env_var.ADMIN]
variable = "STARSHIP_IS_ADMIN"
style = "bold #ffeb95"
format = "[# ](fg:#ffeb95) "
