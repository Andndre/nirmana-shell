# =====================================================================
# Nirmana-Shell - Transpiled Theme: emodipt-extend
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$directory\
$time\
$shell\
$git_branch\
$git_status\
$fill\
$cmd_duration\
$line_break\
$sudo\
$character\
"""

[fill]
symbol = " "

[directory]
format = "[ $path](fg:cyan) "
truncation_length = 3
truncation_symbol = "…/"

[time]
format = "[ $time](fg:#E5C07B) "
disabled = false
time_format = "%H:%M"

[shell]
format = "[ $version](fg:#E06C75) "

[git_status]
format = "([$all_status$ahead_behind](red) )"
modified = " ✎"
staged = " "

[git_branch]
format = "[ $branch](#F3C267) "

[cmd_duration]
format = "[  $duration ](fg:#b8ff75)"

[sudo]
disabled = false
symbol = "⚡ "
format = "[⚡ ](#E06C75) "

[character]
success_symbol = "[❯ ](bold #E06C75) "
error_symbol = "[❯ ](bold #ef5350) "
