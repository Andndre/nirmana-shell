# =====================================================================
# Nirmana-Shell - Transpiled Theme: emodipt-extend
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler v3.1
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$time\
$shell\
$git_branch\
$git_status\
$fill\
$status\
$cmd_duration\
$line_break\
$directory\
$line_break\
${env_var.ADMIN}\
$character\
"""

[fill]
symbol = " "

[character]
success_symbol = "[❯ ](bold #E06C75) "
error_symbol = "[❯ ](bold #ef5350) "

[time]
format = "[\\[](bold #E5C07B)[$time](bold #E5C07B)[\\]](bold #E5C07B)"
disabled = false
time_format = "%H:%M"

[git_branch]
format = "[on ](fg:#ffffff)[ $branch](bold #F3C267)"

[git_status]
format = "([$all_status$ahead_behind](bold #F3C267)) "
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[status]
format = "[ $status ](bold #b8ff75)"

[cmd_duration]
format = "[ $duration ](bold #b8ff75)"
min_time = 2000

[directory]
format = "[ $path ](fg:#61AFEF) "
truncation_length = 3
truncation_symbol = "…/"

[env_var.ADMIN]
variable = "STARSHIP_IS_ADMIN"
style = "bold #E06C75"
format = "[ ⚡ ]($style) "
