# =====================================================================
# Nirmana-Shell - Transpiled Theme: peru
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$directory\
$username\
$python\
$git_branch\
$git_status\
$fill\
$nodejs\
$java\
$cmd_duration\
$time\
$line_break\
$character\
"""

[fill]
symbol = " "

[directory]
format = "[ $path](fg:cyan) "
truncation_length = 3
truncation_symbol = "…/"

[username]
format = "[$user](fg:#26C6DA) "
show_always = true

[python]
format = "[󰌠 $version](fg:#0fc469) "

[git_status]
format = "([$all_status$ahead_behind](red) )"
modified = " ✎"
staged = " "

[git_branch]
format = "[ $branch](#FFE700) "

[nodejs]
format = "[](fg:#6CA35E)[ 󰎙 $version ](fg:#ffffff bg:#6CA35E)"

[java]
format = "[](fg:#4c1f5e bg:#6CA35E)[  $version ](fg:#ffffff bg:#4c1f5e)"

[cmd_duration]
format = "[  $duration ](fg:#bab02a)"

[time]
format = "[  $time ](fg:#00C5C7)"
disabled = false
time_format = "%H:%M:%S"

[character]
success_symbol = "[❯ ](bold #43D426) "
error_symbol = "[❯ ](bold #ef5350) "
