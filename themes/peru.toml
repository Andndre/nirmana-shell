# =====================================================================
# Nirmana-Shell - Transpiled Theme: peru
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$username\
$directory\
$git_branch\
$git_status\
$fill\
$python\
$nodejs\
$java\
$cmd_duration\
$time\
$line_break\
$character\
"""

[fill]
symbol = " "

[username]
show_always = true
format = "[ ](#ff70a6)[$user](#26C6DA) "

[python]
symbol = "󰌠 "
format = "[󰌠 $version](#0fc469) "

[git_branch]
format = "[ $branch](#FFE700)"

[git_status]
format = "([$all_status$ahead_behind](#FFE700) )"
modified = " "
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[nodejs]
symbol = "󰎙 "
format = "[](fg:#6CA35E)[󰎙 $version](fg:#ffffff bg:#6CA35E)[](fg:#6CA35E) "

[java]
symbol = " "
format = " [](fg:#4c1f5e)[ $version](fg:#ffffff bg:#4c1f5e)[](fg:#4c1f5e) "

[character]
success_symbol = "[❯ ](bold #43D426) "
error_symbol = "[❯ ](bold #ef5350) "

[cmd_duration]
min_time = 1
format = "[ $duration](#bab02a) "

[time]
disabled = false
time_format = "%H:%M:%S"
format = "[ $time](#00C5C7) "

[directory]
format = "[ $path](#77E4F7) "
truncation_length = 3
truncation_symbol = "…/"
