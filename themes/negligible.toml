# =====================================================================
# Nirmana-Shell - Transpiled Theme: negligible
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$fill\
$dart\
$nodejs\
$python\
$battery\
$time\
$line_break\
$character\
"""

[fill]
symbol = " "

[directory]
format = "[ $path](fg:#18FFFF) "
truncation_length = 3
truncation_symbol = "…/"

[git_status]
format = "([$all_status$ahead_behind](red) )"
modified = " ✎"
staged = " "

[git_branch]
format = "[ $branch](#F1502F) "

[dart]
format = "[  $version ](fg:#06A4CE)"

[nodejs]
format = "[ 󰎙 $version ](fg:#6CA35E)"

[python]
format = "[ 󰌠 $version ](fg:#4584b6)"

[battery]
format = "[ 󰁹 $percentage ](fg:#4caf50)"
disabled = false

[time]
format = "[  $time ](fg:#A5D6A7)"
disabled = false
time_format = "%H:%M:%S"

[character]
success_symbol = "[➜ ](bold #A5D6A7) "
error_symbol = "[➜ ](bold #ef5350) "
