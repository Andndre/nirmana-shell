# =====================================================================
# Nirmana-Shell - Transpiled Theme: negligible
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler v3.1
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$os\
$directory\
$git_branch\
$git_status\
$fill\
${env_var.ADMIN}\
$dart\
$nodejs\
$python\
$battery\
$time\
$line_break\
$character\
"""

[fill]
symbol = " "

[character]
success_symbol = "[➔  ](bold #A5D6A7) "
error_symbol = "[➔  ](bold #ef5350) "

[os]
disabled = false
style = "bold #18FFFF"
format = "[ $symbol ]($style) "

[os.symbols]
Windows = ""
Ubuntu = ""
Macos = ""
Linux = ""

[directory]
format = "[$path ](fg:#18FFFF) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[ $branch](bold #F1502F)"

[git_status]
format = "([$all_status$ahead_behind](bold #F1502F)) "
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[env_var.ADMIN]
format = "[ ⚡  ](bold #FF5252)"
variable = "STARSHIP_IS_ADMIN"

[dart]
format = "[  $version ](bold #06A4CE)"

[nodejs]
format = "[  $version ](bold #6CA35E)"

[python]
format = "[ 󰌠 $version ](bold #4584b6)"

[battery]
format = "[󰁹 $percentage ](bold #4caf50)"
disabled = false

[[battery.display]]
threshold = 100
style = "bold #A6E3A1"

[time]
format = "[ $time ](bold #A5D6A7)"
disabled = false
time_format = "%H:%M:%S"
