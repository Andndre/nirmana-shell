# =====================================================================
# Nirmana-Shell - Transpiled Theme: jblab_2021
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = false

format = """
$directory\
$git_branch\
$git_status\
$time\
$cmd_duration\
$character\
"""

[directory]
format = "[](fg:#26BDBB)[  $path ](fg:#0C212F bg:#26BDBB)"
truncation_length = 3
truncation_symbol = "…/"

[git_status]
format = "([$all_status$ahead_behind ](fg:#FFFFFF bg:#280C2E))"
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[git_branch]
format = "[](fg:#26BDBB bg:#280C2E)[  $branch](fg:#FFFFFF bg:#280C2E)"

[time]
format = "[](fg:#280C2E bg:#0C212F)[  $time ](fg:#FFFFFF bg:#0C212F)"
disabled = false
time_format = "%H:%M"

[cmd_duration]
format = "[](fg:#0C212F bg:#26BDBB)[  $duration ](fg:#0C212F bg:#26BDBB)[](fg:#26BDBB) "
min_time = 1

[character]
success_symbol = ""
error_symbol = ""
