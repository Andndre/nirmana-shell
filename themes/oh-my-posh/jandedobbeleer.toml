# =====================================================================
# Nirmana-Shell - Oh-My-Posh Port: JanDeDobbeleer Signature Theme
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$bun\
$dart\
$nodejs\
$python\
$package\
$cmd_duration\
$line_break\
$character"""

[character]
success_symbol = "[❯](bold #ff479c) "
error_symbol = "[❯](bold #ef5350) "

[directory]
format = "[](fg:#ff479c)[ $path](bg:#ff479c fg:#ffffff)[](fg:#ff479c bg:#fffb38)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[  $branch](bg:#fffb38 fg:#193549)"

[git_status]
format = "[$all_status$ahead_behind](bg:#fffb38 fg:#193549)[](fg:#fffb38) "
style = "bg:#fffb38 fg:#193549"
conflicted = " 󰞇"
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"
untracked = " ?"
stashed = " "
modified = " !"
staged = " +"
renamed = " »"
deleted = " ✘"

[bun]
format = "[](fg:#FEAC19)[ $version](bg:#FEAC19 fg:#ffffff)[](fg:#FEAC19) "
version_format = "v${raw}"

[dart]
symbol = " "
format = "[](fg:#00897b)[$symbol$version](bg:#00897b fg:#ffffff)[](fg:#00897b) "
version_format = "v${raw}"

[nodejs]
symbol = "󰎙 "
format = "[](fg:#6CA35E)[$symbol$version](bg:#6CA35E fg:#ffffff)[](fg:#6CA35E) "
version_format = "v${raw}"

[python]
symbol = "󰌠 "
format = "[](fg:#FFDE57)[$symbol$version](bg:#FFDE57 fg:#111111)[](fg:#FFDE57) "
version_format = "v${raw}"

[package]
symbol = "󰏗 "
format = "[](fg:#83769c)[$symbol$version](bg:#83769c fg:#ffffff)[](fg:#83769c) "
version_format = "v${raw}"
disabled = false

[cmd_duration]
min_time = 2_000
format = "[](fg:#83769c)[ $duration](bg:#83769c fg:#ffffff)[](fg:#83769c) "
