# =====================================================================
# Nirmana-Shell - Transpiled Theme: illusi0n
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler v3.1
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = false

format = """
$os\
$username\
$directory\
$git_branch\
$git_status\
$character\
"""

[character]
success_symbol = "[❯ ](bold #ff8800) "
error_symbol = "[❯ ](bold #ef5350) "

[os]
disabled = false
style = "bold #ff8800"
format = "[ $symbol ]($style) "

[os.symbols]
Windows = ""
Ubuntu = ""
Macos = ""
Linux = ""

[username]
format = "[$user ](bold #ff8800)"
show_always = true

[directory]
format = "[$path ](fg:#62c0ff) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[on ](fg:#ff8800)[ $branch](bold #62c0ff)"

[git_status]
format = "([$all_status$ahead_behind](bold #62c0ff)) "
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[memory_usage]
format = "[$ram_pct ]($style)"
disabled = false
threshold = -1
symbol = ""
style = "bold #ff8800"
