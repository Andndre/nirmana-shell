# =====================================================================
# Nirmana-Shell - Transpiled Theme: capr4n
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler v3.1
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = false

format = """
$username\
$directory\
$git_branch\
$git_status\
$character\
"""

[character]
format = "$symbol"
success_symbol = ""
error_symbol = ""

[username]
format = "[ $user ](fg:#ffffff bg:#61AFEF)[](fg:#61AFEF)"
show_always = true

[directory]
format = "[](fg:#C678DD inverted)[ $path ](fg:#ffffff bg:#C678DD)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[](fg:prev_bg bg:#95ffa4)[  $branch ](fg:#193549 bg:#95ffa4)"

[git_status]
format = "([$all_status$ahead_behind ](fg:#193549 bg:#95ffa4))[](fg:#95ffa4) "
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[time]
format = "[](fg:#003543 bg:prev_bg)[ $time ](fg:#ffffff bg:#003543)"
disabled = false
time_format = "%H:%M:%S"

[cmd_duration]
format = "[](fg:#83769c bg:prev_bg)[  $duration ](fg:#ffffff bg:#83769c)"
min_time = 2000
