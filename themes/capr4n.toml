# =====================================================================
# Nirmana-Shell - Transpiled Theme: capr4n
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$username\
$directory\
$git_branch\
$git_status\
$fill\
$time\
$cmd_duration\
$line_break\
$character\
"""

[fill]
symbol = " "

[time]
disabled = false
time_format = "%H:%M:%S"
format = "[](fg:#003543)[ $time](fg:#ffffff bg:#003543)[](fg:#003543) "

[cmd_duration]
min_time = 1
format = "[](fg:#83769c)[ $duration](fg:#ffffff bg:#83769c)[](fg:#83769c) "

[username]
show_always = true
format = "[](fg:#61AFEF)[ $user](fg:#ffffff bg:#61AFEF)[](fg:#61AFEF) "

[directory]
format = "[](fg:#C678DD)[ $path](fg:#ffffff bg:#C678DD)[](fg:#C678DD) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[](fg:#95ffa4)[ $branch](fg:#193549 bg:#95ffa4)"

[git_status]
format = "([$all_status$ahead_behind](fg:#193549 bg:#95ffa4)[](fg:#95ffa4) )"
modified = " "
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[character]
success_symbol = "[❯](bold green) "
error_symbol = "[❯](bold red) "
