# =====================================================================
# Nirmana-Shell - Transpiled Theme: easy-term
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler v3.1
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$os\
$directory\
$git_branch\
$git_status\
$fill\
$memory_usage\
$nodejs\
$php\
$cmd_duration\
$time\
$line_break\
$character\
"""

[fill]
symbol = " "

[character]
format = "[╰─](fg:#0c7bbb) $symbol"
success_symbol = ""
error_symbol = "[x ](bold #ef5350)"

[os]
disabled = false
style = "fg:#ffffff bg:#0c7bbb"
format = "[╭─](fg:#0c7bbb)[ $symbol ]($style)"

[os.symbols]
Windows = "󰕮"
Ubuntu = ""
Macos = ""
Linux = ""

[directory]
format = "[](fg:prev_bg bg:#8a62da)[ $path ](fg:#ffffff bg:#8a62da)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[](fg:prev_bg bg:#191f48)[  $branch ](fg:#43CCEA bg:#191f48)"

[git_status]
format = "([$all_status$ahead_behind ](fg:#43CCEA bg:#191f48))"
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[memory_usage]
format = "[](fg:#0b2942 bg:prev_bg)[  $ram ](fg:#81ff91 bg:#0b2942)"
disabled = false
threshold = -1
symbol = ""

[nodejs]
format = "[](fg:#0b2942 bg:prev_bg)[  $version ](fg:#81ff91 bg:#0b2942)"

[php]
format = "[](fg:#0b2942 bg:prev_bg)[  $version ](fg:#81ff91 bg:#0b2942)"

[cmd_duration]
format = "[](fg:#cecece bg:prev_bg)[ $duration ](fg:#4b4b4b bg:#cecece)"
min_time = 2000

[time]
format = "[](fg:#cecece bg:prev_bg)[ $time ](fg:#4b4b4b bg:#cecece)[](fg:#cecece)"
disabled = false
time_format = "%H:%M:%S"
