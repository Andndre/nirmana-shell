# =====================================================================
# Nirmana-Shell - Transpiled Theme: easy-term
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$fill\
$memory_usage\
$nodejs\
$php\
$cmd_duration\
$time\
$line_break\
$character\
"""

[fill]
symbol = " "

[directory]
format = "[╭─](fg:#8a62da)[  $path ](fg:#ffffff bg:#8a62da)"
truncation_length = 3
truncation_symbol = "…/"

[git_status]
format = "([$all_status$ahead_behind ](fg:#43CCEA bg:#191f48))[](fg:#191f48) "
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[git_branch]
format = "[](fg:#8a62da bg:#191f48)[  $branch](fg:#43CCEA bg:#191f48)"

[memory_usage]
format = "[ 󰍛 $ram_pct ](fg:#81ff91)"

[nodejs]
format = "[ 󰎙 $version ](fg:#81ff91)"

[php]
format = "[  $version ](fg:#81ff91)"

[cmd_duration]
format = "[  $duration ](fg:#4b4b4b bg:#cecece)"

[time]
format = "[  $time ](fg:#4b4b4b bg:#cecece)"
disabled = false
time_format = "%H:%M:%S"

[character]
success_symbol = "[╰─ ](bold #0c7bbb) "
error_symbol = "[╰─ ](bold #ef5350) "
