# =====================================================================
# Nirmana-Shell - Transpiled Theme: cloud-context
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$fill\
$aws\
$cmd_duration\
$time\
$line_break\
$sudo\
$character\
"""

[fill]
symbol = " "

[time]
disabled = false
time_format = "%H:%M:%S"
format = "[ $time](#dd0033) "

[aws]
symbol = " "
format = "[ $version](#4285F4) "

[git_branch]
format = "[ $branch](#238636)"

[git_status]
format = "([$all_status$ahead_behind](#238636) )"
modified = " "
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[cmd_duration]
min_time = 1
format = "[ $duration](#dd0033) "

[character]
success_symbol = "[❯ ](bold #238636) "
error_symbol = "[❯ ](bold #ef5350) "

[directory]
format = "[ $path](#ffffff) "
truncation_length = 3
truncation_symbol = "…/"

[sudo]
disabled = false
symbol = " "
format = "[ ](#dd0033) "
