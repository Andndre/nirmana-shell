# =====================================================================
# Nirmana-Shell - Transpiled Theme: cloud-context
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$time\
$aws\
$git_branch\
$git_status\
$cmd_duration\
$character\
$line_break\
$time\
$directory\
$git_branch\
$git_status\
$sudo\
"""

[time]
disabled = false
time_format = "%H:%M:%S"
format = "[](fg:transparent)[ $time](#dd0033)[](fg:transparent) "

[aws]
symbol = " "
format = "[ $version](#4285F4)[](fg:transparent) "

[git_branch]
format = "[](fg:transparent)[ $branch](#238636)"

[git_status]
format = "([$all_status$ahead_behind](#238636)[](fg:transparent) )"
modified = " "
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[cmd_duration]
min_time = 1
format = "[ $duration](#dd0033)[](fg:transparent) "

[character]
success_symbol = "[❯ ](bold #dd0033) "
error_symbol = "[❯ ](bold #ef5350) "

[directory]
format = "[ $path](#ffffff)[](fg:transparent) "
truncation_length = 3
truncation_symbol = "…/"

[sudo]
disabled = false
symbol = " "
format = "[ ](transparent)"
