# =====================================================================
# Nirmana-Shell - Transpiled Theme: cloud-context
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$directory\
$time\
$git_branch\
$git_status\
$cmd_duration\
$line_break\
$sudo\
$character\
"""

[directory]
format = "[ $path](fg:cyan) "
truncation_length = 3
truncation_symbol = "…/"

[time]
format = "[ $time](fg:#dd0033) "
disabled = false
time_format = "%H:%M:%S"

[git_status]
format = "([$all_status$ahead_behind](red) )"
modified = " ✎"
staged = " "

[git_branch]
format = "[ $branch](#238636) "

[cmd_duration]
format = "[ $duration](fg:#dd0033) "
min_time = 1

[sudo]
disabled = false
symbol = " "
format = "[ ](#dd0033) "

[character]
success_symbol = "[> ](bold #238636) "
error_symbol = "[> ](bold #ef5350) "
