# =====================================================================
# Nirmana-Shell - Transpiled Theme: cloud-context
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler v3.1
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$aws\
$azure\
$cmd_duration\
$status\
$line_break\
$directory\
$git_branch\
$git_status\
$line_break\
$character\
"""

[character]
format = "$symbol"
success_symbol = "[](fg:#dd0033)[ ⚡ ](fg:#151515 bg:#dd0033)[](fg:#dd0033)[ > ](bold #238636)"
error_symbol = "[](fg:#dd0033)[ ⚡ ](fg:#151515 bg:#dd0033)[](fg:#dd0033)[ > ](bold #ef5350)"

[aws]
format = "[ $version ](bold #4285F4) "

[azure]
format = "[ $version ](bold #4285F4) "

[cmd_duration]
format = "[ $duration  ](bold #dd0033) "
min_time = 2000

[status]
format = "[](fg:#dd0033)[ $symbol ](fg:#242424 bg:#dd0033)[](fg:#dd0033) "
disabled = false
symbol = "❌"
success_symbol = ""

[directory]
format = "[ $path ](fg:#ffffff)[](bold #ffffff) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[ $branch](bold #238636)"

[git_status]
format = "([$all_status$ahead_behind](bold #238636)) "
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"
