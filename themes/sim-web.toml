# =====================================================================
# Nirmana-Shell - Transpiled Theme: sim-web
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$fill\
$nodejs\
$cmd_duration\
$line_break\
$character\
"""

[fill]
symbol = " "

[cmd_duration]
min_time = 1
format = "[ $duration](#a9ffb4) "

[nodejs]
symbol = "󰎙 "
format = "[󰎙 $version](#45bf17) "

[directory]
format = "[ $path](#ffafd2) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[ $branch](#f14e32)"

[git_status]
format = "([$all_status$ahead_behind](#f14e32) )"
modified = " "
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[character]
success_symbol = "[❯ ](bold #00c7fc) "
error_symbol = "[❯ ](bold #ef5350) "
