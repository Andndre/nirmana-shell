# =====================================================================
# Nirmana-Shell - Transpiled Theme: sonicboom_light
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler v3.1
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
${env_var.ADMIN}\
$os\
$directory\
$git_branch\
$git_status\
$cmd_duration\
$fill\
$username\
$hostname\
$time\
$line_break\
$character\
"""

[fill]
symbol = " "

[character]
success_symbol = "[ ](bold #00ff0d) "
error_symbol = "[ ](bold #ff0000) "

[env_var.ADMIN]
variable = "STARSHIP_IS_ADMIN"
style = "fg:#dd1e1e bg:#000000"
format = "[ ⚡ ]($style)"

[os]
disabled = false
style = "fg:#ffffff bg:#000000"
format = "[ $symbol ]($style)"

[os.symbols]
Windows = "󰕮"
Ubuntu = ""
Macos = ""
Linux = ""

[directory]
format = "[](fg:prev_bg bg:#4d4d4d)[ $path ](fg:#43CCEA bg:#4d4d4d)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[  $branch ](fg:#00ff0d bg:#4d4d4d)"

[git_status]
format = "([$all_status$ahead_behind ](fg:#00ff0d bg:#4d4d4d))"
modified = " ~${count}"
staged = " +${count}"
stashed = " *${count}"
ahead = " ↑${count}"
behind = " ↓${count}"
diverged = " ↕↑${ahead_count}↓${behind_count}"
deleted = " -${count}"

[cmd_duration]
format = "[ ](fg:#ffffff bg:#4d4d4d)[ $duration ](fg:#ffffff bg:#4d4d4d)[](fg:#4d4d4d) "
min_time = 0
show_milliseconds = true

[username]
style_user = "fg:#43CCEA bg:#4d4d4d"
style_root = "fg:#FFEB3B bg:#4d4d4d"
format = "[](fg:#4d4d4d)[ $user ]($style)"
show_always = true

[hostname]
style = "fg:#43CCEA bg:#4d4d4d"
format = "[/ $hostname ]($style)"
ssh_only = false

[time]
format = "[ $time ](fg:#43CCEA bg:#4d4d4d)[](fg:#4d4d4d) "
disabled = false
time_format = "%I:%M:%S %p"
