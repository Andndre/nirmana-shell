# =====================================================================
# Nirmana-Shell - Transpiled Theme: iterm2
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$username\
$directory\
$git_branch\
$git_status\
$fill\
$battery\
$python\
$time\
$line_break\
$sudo\
$character\
"""

[fill]
symbol = " "

[username]
format = "[$user ](fg:#d2ff5e bg:#003543)"
show_always = true

[directory]
format = "[](fg:#003543 bg:#0087D8)[  $path ](fg:#003544 bg:#0087D8)"
truncation_length = 3
truncation_symbol = "…/"

[git_status]
format = "([$all_status$ahead_behind ](fg:#193549 bg:#d2ff5e))[](fg:#d2ff5e) "
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[git_branch]
format = "[](fg:#0087D8 bg:#d2ff5e)[  $branch](fg:#193549 bg:#d2ff5e)"

[battery]
format = "[](fg:#f36943)[ 󰁹 $percentage ](fg:#242424 bg:#f36943)"
disabled = false

[python]
format = "[](fg:#0087D8 bg:#f36943)[ 󰌠 $version ](fg:#003544 bg:#0087D8)"

[time]
format = "[](fg:#003543 bg:#0087D8)[  $time ](fg:#ffffff bg:#003543)"
disabled = false
time_format = "%H:%M:%S"

[sudo]
disabled = false
symbol = "⚡ "
format = "[⚡ ](#FFD700) "

[character]
success_symbol = "[🚀 ](bold #f1184c) "
error_symbol = "[🚀 ](bold #ef5350) "
