# =====================================================================
# Nirmana-Shell - Transpiled Theme: sorin
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = false

format = """
$username\
$directory\
$git_branch\
$git_status\
$python\
$character\
"""

[username]
format = "[$user](fg:#FFFFFF) "
show_always = true

[directory]
format = "[ $path](fg:#0973C0) "
truncation_length = 3
truncation_symbol = "…/"

[git_status]
format = "([$all_status$ahead_behind](red) )"
modified = " ✎"
staged = " "

[git_branch]
format = "[ $branch](#C1C106) "

[python]
format = "[󰌠 $version](fg:#100e23) "

[character]
success_symbol = ""
error_symbol = ""
