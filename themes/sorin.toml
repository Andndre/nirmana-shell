# =====================================================================
# Nirmana-Shell - Transpiled Theme: sorin
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$character\
$sudo\
$username\
$directory\
$git_branch\
$git_status\
$python\
$line_break\
$character\
"""

[character]
success_symbol = "[❯ ](bold #CB4B16) "
error_symbol = "[❯ ](bold #ef5350) "

[sudo]
disabled = false
symbol = " "
format = "[ ](#CECE04)"

[username]
show_always = true
format = "[ ](#ff70a6)[$user](#FFFFFF) "

[directory]
format = "[ $path](#0973C0) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[ $branch](#C1C106)"

[git_status]
format = "([$all_status$ahead_behind](#C1C106) )"
modified = " "
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[python]
symbol = "󰌠 "
format = "[󰌠 $version](#100e23) "
