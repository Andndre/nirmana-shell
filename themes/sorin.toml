# =====================================================================
# Nirmana-Shell - Transpiled Theme: sorin
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler v3.1
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = false

format = """
$status\
${env_var.ADMIN}\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$python\
$character\
"""

[character]
success_symbol = "[❯❯❯ ](bold #ffffff) "
error_symbol = "[❯❯❯ ](bold #ef5350) "

[status]
format = "[$symbol ](fg:#CB4B16)"
symbol = "❌"
disabled = false

[env_var.ADMIN]
variable = "STARSHIP_IS_ADMIN"
style = "bold #CECE04"
format = "[  ]($style) "

[username]
format = "[$user ](bold #FFFFFF)"
show_always = true

[hostname]
format = "[@$hostname ](bold #FFFFFF) "
ssh_only = true

[directory]
format = "[$path ](fg:#0973C0) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[ $branch](bold #C1C106)"

[git_status]
format = "([$all_status$ahead_behind](bold #C1C106)) "
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[python]
format = "[ 󰌠 $version ](bold #100e23)"
