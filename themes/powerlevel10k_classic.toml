# =====================================================================
# Nirmana-Shell - Transpiled Theme: powerlevel10k_classic
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$fill\
$username\
$time\
$line_break\
$character\
"""

[fill]
symbol = " "

[directory]
format = "[  $path ](fg:#26C6DA bg:#546E7A)"
truncation_length = 3
truncation_symbol = "…/"

[git_status]
format = "([$all_status$ahead_behind ](fg:#D4E157 bg:#546E7A))[](fg:#546E7A) "
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[git_branch]
format = "[  $branch](fg:#D4E157 bg:#546E7A)"

[username]
format = "[](fg:#546E7A)[ $user ](fg:#D4E157 bg:#546E7A)"

[time]
format = "[  $time ](fg:#D4E157 bg:#546E7A)"
disabled = false
time_format = "%H:%M:%S"

[character]
success_symbol = "[❯ ](bold #D4E157) "
error_symbol = "[❯ ](bold #FF5252) "
