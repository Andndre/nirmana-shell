# =====================================================================
# Nirmana-Shell - Transpiled Theme: grandpa-style
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$cmd_duration\
$fill\
$username\
$time\
$line_break\
$character\
"""

[fill]
symbol = " "

[directory]
format = "[  $path ](fg:#43CCEA bg:#5a3d29)"
truncation_length = 3
truncation_symbol = "…/"

[git_status]
format = "([$all_status$ahead_behind ](fg:#000000 bg:#00C853))"
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[git_branch]
format = "[](fg:#5a3d29 bg:#00C853)[  $branch](fg:#000000 bg:#00C853)"

[cmd_duration]
format = "[](fg:#00C853 bg:#2ba1bb)[  $duration ](fg:#5a3d29 bg:#2ba1bb)[](fg:#2ba1bb) "
min_time = 1

[username]
format = "[](fg:#5a3d29)[ $user ](fg:#43CCEA bg:#5a3d29)"

[time]
format = "[  $time ](fg:#43CCEA bg:#5a3d29)"
disabled = false
time_format = "%I:%M:%S %p"

[character]
success_symbol = "[❯ ](bold #ffffff) "
error_symbol = "[❯ ](bold #ff0000) "
