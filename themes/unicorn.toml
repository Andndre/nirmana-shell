# =====================================================================
# Nirmana-Shell - Transpiled Theme: unicorn
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$time\
$cmd_duration\
$line_break\
$sudo\
$character\
"""

[directory]
format = "[  $path ](fg:#003544 bg:#0087D8)"
truncation_length = 3
truncation_symbol = "…/"

[git_status]
format = "([$all_status$ahead_behind ](fg:#193549 bg:#d2ff5e))"
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[git_branch]
format = "[](fg:#0087D8 bg:#d2ff5e)[  $branch](fg:#193549 bg:#d2ff5e)"

[time]
format = "[](fg:#d2ff5e bg:#003543)[  $time ](fg:#ffffff bg:#003543)"
disabled = false
time_format = "%H:%M:%S"

[cmd_duration]
format = "[](fg:#003543 bg:#83769c)[  $duration ](fg:#ffffff bg:#83769c)[](fg:#83769c) "
min_time = 1

[sudo]
disabled = false
symbol = "⚡ "
format = "[⚡ ](#ffffff) "

[character]
success_symbol = "[🦄 ](bold #f1184c) "
error_symbol = "[🦄 ](bold #ef5350) "
