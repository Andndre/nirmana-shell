# =====================================================================
# Nirmana-Shell - Transpiled Theme: unicorn
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler v3.1
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$os\
$directory\
$git_branch\
$git_status\
$cmd_duration\
$line_break\
${env_var.ADMIN}\
$character\
"""

[character]
success_symbol = "[🦄 ](bold #f1184c) "
error_symbol = "[🦄 ](bold #ef5350) "

[os]
disabled = false
style = "fg:#ffffff bg:#003543"
format = "[ $symbol ]($style)"

[os.symbols]
Windows = "󰕮"
Ubuntu = ""
Macos = ""
Linux = ""

[directory]
format = "[](fg:prev_bg bg:#0087D8)[  $path ](fg:#003544 bg:#0087D8)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[](fg:prev_bg bg:#d2ff5e)[  $branch ](fg:#193549 bg:#d2ff5e)"

[git_status]
format = "([$all_status$ahead_behind ](fg:#193549 bg:#d2ff5e))"
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[cmd_duration]
format = "[](fg:prev_bg bg:#83769c)[  $duration ](fg:#ffffff bg:#83769c)[](fg:#83769c) "
min_time = 0
show_milliseconds = true

[env_var.ADMIN]
variable = "STARSHIP_IS_ADMIN"
style = "bold #ffffff"
format = "[  ]($style) "
