# =====================================================================
# Nirmana-Shell - Transpiled Theme: powerlevel10k_lean
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler v3.1
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = false

format = """
$directory\
$git_branch\
$git_status\
$character\
"""

[character]
success_symbol = "[❯ ](bold #43D426) "
error_symbol = "[❯ ](bold #ef5350) "

[directory]
format = "[$path ](fg:#77E4F7) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[ $branch](bold #FFE700)"

[git_status]
format = "([$all_status$ahead_behind](bold #FFE700)) "
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[time]
format = "[ $time ](bold #00C5C7)"
disabled = false
time_format = "%H:%M:%S"
