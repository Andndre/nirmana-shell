# =====================================================================
# Nirmana-Shell - Transpiled Theme: powerlevel10k_lean
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = false

format = """
$directory\
$git_branch\
$git_status\
$character\
$fill\
$time\
"""

[fill]
symbol = " "

[directory]
format = "[ $path](fg:#77E4F7) "
truncation_length = 3
truncation_symbol = "…/"

[git_status]
format = "([$all_status$ahead_behind](red) )"
modified = " ✎"
staged = " "

[git_branch]
format = "[ $branch](#FFE700) "

[time]
format = "[  $time ](fg:#00C5C7)"
disabled = false
time_format = "%H:%M:%S"

[character]
success_symbol = ""
error_symbol = ""
