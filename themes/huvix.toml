# =====================================================================
# Nirmana-Shell - Transpiled Theme: huvix
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$username\
$directory\
$golang\
$python\
$git_branch\
$git_status\
$cmd_duration\
$line_break\
$battery\
$character\
"""

[username]
show_always = true
format = "[ ](#ff70a6)[$user](#FFE082) "

[directory]
format = "[ $path](#56B6C2) "
truncation_length = 3
truncation_symbol = "…/"

[golang]
symbol = " "
format = "[ $version](#7FD5EA) "

[python]
symbol = "󰌠 "
format = "[󰌠 $version](#9e7eff) "

[git_branch]
format = "[$branch](#56B6C2)"

[git_status]
format = "([$all_status$ahead_behind](#56B6C2) )"
modified = " "
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[cmd_duration]
min_time = 1
format = "[ $duration](#FFAB91) "

[battery]
disabled = false
format = "[$symbol$percentage](#193549) "

[character]
success_symbol = "[❯](bold green) "
error_symbol = "[❯](bold red) "
