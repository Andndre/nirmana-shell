# =====================================================================
# Nirmana-Shell - Transpiled Theme: huvix
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler v3.1
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$username\
$directory\
$golang\
$git_branch\
$git_status\
$fill\
$python\
$cmd_duration\
$line_break\
$battery\
$character\
"""

[fill]
symbol = " "

[character]
success_symbol = "[❯ ](bold #22da6e) "
error_symbol = "[❯ ](bold #ef5350) "

[username]
format = "[$user ](bold #FFE082)"
show_always = true

[directory]
format = "[$path ](fg:#56B6C2) "
truncation_length = 3
truncation_symbol = "…/"

[golang]
format = "[ $version ](bold #7FD5EA) "

[git_branch]
format = "[ $branch](bold #56B6C2)"

[git_status]
format = "([$all_status$ahead_behind](bold #56B6C2)) "
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[python]
format = "[ 󰌠 $version ](bold #9e7eff)"

[cmd_duration]
format = "[ $duration ](bold #FFAB91)"
min_time = 2000

[battery]
format = "[\\[](bold #193549)[󰁹 $percentage](bold #193549)[\\]](bold #193549)"
disabled = false

[[battery.display]]
threshold = 100
style = "bold #193549"
