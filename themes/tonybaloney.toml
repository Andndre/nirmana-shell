# =====================================================================
# Nirmana-Shell - Transpiled Theme: tonybaloney
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = false

format = """
$directory\
$git_branch\
$git_status\
$python\
$character\
"""

[directory]
format = "[](fg:#18354c)[  $path ](fg:#ffc107 bg:#18354c)"
truncation_length = 3
truncation_symbol = "…/"

[git_status]
format = "([$all_status$ahead_behind ](fg:#ffc107 bg:#18354c))"
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[git_branch]
format = "[  $branch](fg:#ffc107 bg:#18354c)"

[python]
format = "[](fg:#18354c bg:#ffc107)[ 󰌠 $version ](fg:#18354c bg:#ffc107)[](fg:#ffc107) "

[character]
success_symbol = ""
error_symbol = ""
