# =====================================================================
# Nirmana-Shell - Transpiled Theme: remk
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = false

format = """
$username\
$directory\
$git_branch\
$git_status\
$time\
$character\
"""

[username]
format = "[](fg:#F48FB1)[$user ](fg:#ffffff bg:#F48FB1)"
show_always = true

[directory]
format = "[](fg:#F48FB1 bg:#FFF59D)[  $path ](fg:#3f3f3f bg:#FFF59D)"
truncation_length = 3
truncation_symbol = "…/"

[git_status]
format = "([$all_status$ahead_behind ](fg:#ffffff bg:#80DEEA))"
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[git_branch]
format = "[](fg:#FFF59D bg:#80DEEA)[  $branch](fg:#ffffff bg:#80DEEA)"

[time]
format = "[](fg:#80DEEA bg:#A5D6A7)[  $time ](fg:#ffffff bg:#A5D6A7)[](fg:#A5D6A7) "
disabled = false
time_format = "%H:%M"

[character]
success_symbol = ""
error_symbol = ""
