# =====================================================================
# Nirmana-Shell - Transpiled Theme: remk
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler v3.1
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = false

format = """
$username\
$directory\
$git_branch\
$git_status\
$character\
"""

[character]
format = "$symbol"
success_symbol = "[](fg:prev_bg) "
error_symbol = "[](fg:prev_bg) "

[username]
format = "[](fg:#F48FB1)[ $user ](fg:#ffffff bg:#F48FB1)"
show_always = true

[directory]
format = "[ $path ](fg:#3f3f3f bg:#FFF59D)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[  $branch ](fg:#ffffff bg:#80DEEA)"

[git_status]
format = "([$all_status$ahead_behind ](fg:#ffffff bg:#80DEEA))"
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"
