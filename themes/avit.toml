# =====================================================================
# Nirmana-Shell - Transpiled Theme: avit
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler v3.1
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$directory\
$git_branch\
$git_status\
${env_var.ADMIN}\
$status\
$line_break\
$character\
"""

[character]
success_symbol = "[ ](bold #007ACC) "
error_symbol = "[ ](bold #ef5350) "

[directory]
format = "[$path ](fg:#ffffff) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[ $branch](bold #C2C206)"

[git_status]
format = "([$all_status$ahead_behind](bold #C2C206)) "
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[env_var.ADMIN]
variable = "STARSHIP_IS_ADMIN"
style = "bold #B5B50D"
format = "[  ]($style) "

[status]
format = "[$symbol ](fg:#C94A16)"
symbol = "❌"
disabled = false
