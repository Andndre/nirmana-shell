# =====================================================================
# Nirmana-Shell - Transpiled Theme: bubblesextra
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$fill\
$directory\
$git_branch\
$python\
$golang\
$nodejs\
$ruby\
$java\
$julia\
$php\
$battery\
$line_break\
$character\
"""

[fill]
symbol = " "

[directory]
format = "[](fg:#29315A)[  $path ](fg:#3EC669 bg:#29315A)"

[git_status]
format = "([$all_status$ahead_behind](red) )"
modified = " ✎"
staged = " "

[git_branch]
format = "[  $branch ](fg:#43CCEA bg:#29315A)"

[python]
format = "[ 󰌠 $version ](fg:#E4F34A bg:#29315A)"

[golang]
format = "[  $version ](fg:#7FD5EA bg:#29315A)"

[nodejs]
format = "[ 󰎙 $version ](fg:#42E66C bg:#29315A)"

[ruby]
format = "[  $version ](fg:#E64747 bg:#29315A)"

[java]
format = "[  $version ](fg:#E64747 bg:#29315A)"

[julia]
format = "[  $version ](fg:#9B6BDF bg:#29315A)"

[php]
format = "[](fg:#4063D8 bg:#29315A)[  $version ](fg:#ffffff bg:#4063D8)"

[battery]
format = "[](fg:#29315A bg:#4063D8)[ 󰁹 $percentage ](fg:#9B6BDF bg:#29315A)"
disabled = false

[character]
success_symbol = "[❯ ](bold #E64747) "
error_symbol = "[❯ ](bold #ef5350) "
