# =====================================================================
# Nirmana-Shell - Transpiled Theme: mt
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler v3.1
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = false

format = """
$username\
$directory\
$git_branch\
$git_status\
$nodejs\
$character\
"""

[character]
format = "$symbol"
success_symbol = "[](fg:prev_bg) "
error_symbol = "[](fg:prev_bg) "

[username]
format = "[](fg:#B4009E)[ $user ](fg:#ffffff bg:#B4009E)"
show_always = true

[directory]
format = "[](fg:prev_bg bg:#FFFF00)[ $path ](fg:#000000 bg:#FFFF00)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[](fg:prev_bg bg:#4E44FF)[  $branch ](fg:#ffffff bg:#4E44FF)"

[git_status]
format = "([$all_status$ahead_behind ](fg:#ffffff bg:#4E44FF))"
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[nodejs]
format = "[](fg:prev_bg bg:#4e903d)[  $version ](fg:#ffffff bg:#4e903d)[](fg:#4e903d) "
