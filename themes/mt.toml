# =====================================================================
# Nirmana-Shell - Transpiled Theme: mt
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = false

format = """
$username\
$directory\
$git_branch\
$git_status\
$nodejs\
$time\
$character\
"""

[username]
format = "[](fg:#B4009E)[$user ](fg:#ffffff bg:#B4009E)"
show_always = true

[directory]
format = "[](fg:#B4009E bg:#FFFF00)[  $path ](fg:#000000 bg:#FFFF00)"
truncation_length = 3
truncation_symbol = "…/"

[git_status]
format = "([$all_status$ahead_behind ](fg:#ffffff bg:#4E44FF))"
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[git_branch]
format = "[](fg:#FFFF00 bg:#4E44FF)[  $branch](fg:#ffffff bg:#4E44FF)"

[nodejs]
format = "[](fg:#4E44FF bg:#4e903d)[ 󰎙 $version ](fg:#ffffff bg:#4e903d)"

[time]
format = "[](fg:#4e903d bg:#16C60C)[  $time ](fg:#ffffff bg:#16C60C)[](fg:#16C60C) "
disabled = false
time_format = "%H:%M"

[character]
success_symbol = ""
error_symbol = ""
