# =====================================================================
# Nirmana-Shell - Transpiled Theme: powerlevel10k_modern
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$sudo\
$directory\
$git_branch\
$git_status\
$fill\
$python\
$golang\
$time\
$line_break\
$character\
"""

[fill]
symbol = " "

[sudo]
disabled = false
symbol = " "
format = "[ ](#000000)"

[directory]
format = "[](fg:#0000ff)[ $path](fg:#ffffff bg:#0000ff)[](fg:#0000ff) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[](fg:#D4E157)[ $branch](fg:#000000 bg:#D4E157)"

[git_status]
format = "([$all_status$ahead_behind](fg:#000000 bg:#D4E157)[](fg:#D4E157) )"
modified = " "
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[python]
symbol = "󰌠 "
format = "[󰌠 $version](fg:#000000 bg:#D4E157) "

[golang]
symbol = " "
format = "[ $version](fg:#ffffff bg:#7FD5EA) "

[time]
disabled = false
time_format = "%H:%M:%S"
format = "[$time](fg:#000000 bg:#ffffff) "

[character]
success_symbol = "[❯ ](bold #D4E157) "
error_symbol = "[❯ ](bold #FF5252) "
