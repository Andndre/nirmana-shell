# =====================================================================
# Nirmana-Shell - Transpiled Theme: lambda
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler v3.1
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = false

format = """
$directory\
$git_branch\
$git_status\
$character\
"""

[character]
success_symbol = "[ ](bold #F5F5F5) "
error_symbol = "[ ](bold #ef5350) "

[directory]
format = "[$path ](fg:#B80101) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[ $branch](bold #B80101)"

[git_status]
format = "([$all_status$ahead_behind](bold #B80101)) "
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"
