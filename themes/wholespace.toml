# =====================================================================
# Nirmana-Shell - Transpiled Theme: wholespace
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler v3.1
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$os\
$time\
$memory_usage\
$cmd_duration\
$fill\
$nodejs\
$git_branch\
$git_status\
$line_break\
$directory\
$character\
"""

[fill]
symbol = " "

[character]
success_symbol = "[ ](bold #00ff15) "
error_symbol = "[ ](bold #ff0000) "

[os]
disabled = false
style = "fg:#011627 bg:#FEF5ED"
format = "[](fg:#FEF5ED)[ $symbol ]($style)"

[os.symbols]
Windows = "󰕮"
Ubuntu = ""
Macos = ""
Linux = ""

[time]
format = "[](fg:#FEF5ED)[ ♡ $time ](fg:#011627 bg:#FEF5ED)[](fg:#FEF5ED inverted) "
disabled = false
time_format = "%H:%M:%S"

[memory_usage]
disabled = false
threshold = -1
style = "fg:#ffffff bg:#516BEB"
symbol = "󰍛"
format = "[](fg:#516BEB)[ 󰍛  RAM:$ram ]($style)[](fg:#516BEB inverted) "

[cmd_duration]
format = "[](fg:#575656)[ $duration ](fg:#d6deeb bg:#575656)[](fg:#575656) "
min_time = 0
show_milliseconds = true

[nodejs]
format = "[](fg:#ffffff bg:prev_bg)[  $version ](fg:#000000 bg:#ffffff)"

[git_branch]
style = "fg:#011627 bg:#17D7A0"
symbol = " "
format = "[](fg:#17D7A0)[  $branch]($style)"

[git_status]
style = "fg:#011627 bg:#17D7A0"
format = "([ $ahead_behind$all_status]($style))[](fg:#17D7A0) "
ahead = "↑${count} "
behind = "↓${count} "
modified = " ~${count} "
staged = " +${count} "
stashed = " ${count} "
untracked = " ${count} "

[directory]
format = "[ $path ](fg:#ffafd2) "
truncation_length = 3
truncation_symbol = "…/"
