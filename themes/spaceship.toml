# =====================================================================
# Nirmana-Shell - Spaceship Custom Theme
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$fill\
$bun\
$dart\
$nodejs\
$python\
$package\
$cmd_duration\
$line_break\
$character"""

[fill]
symbol = " "

[character]
success_symbol = "[🚀](bold) "
error_symbol = "[💥](bold) "

[directory]
style = "bold cyan"
format = "[$path]($style) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
style = "bold purple"
symbol = " "
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold red"
format = '([\[$all_status$ahead_behind\]]($style) )'
modified = "!"
untracked = "?"
staged = "+"
ahead = "⇡"
behind = "⇣"

[bun]
style = "bold #FEAC19"
symbol = " "
format = "via [$symbol$version]($style) "
version_format = "v${raw}"

[dart]
style = "bold #00acd7"
symbol = " "
format = "via [$symbol$version]($style) "
version_format = "v${raw}"

[nodejs]
style = "bold green"
symbol = "󰎙 "
format = "via [$symbol$version]($style) "
version_format = "v${raw}"

[python]
style = "bold yellow"
symbol = "󰌠 "
format = "via [$symbol$version]($style) "
version_format = "v${raw}"

[package]
style = "bold #CBA6F7"
symbol = "󰏗 "
format = "is [$symbol$version]($style) "
version_format = "v${raw}"
disabled = false

[cmd_duration]
min_time = 2_000
style = "bold yellow"
format = "took [$duration]($style) "
