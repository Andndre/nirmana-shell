# =====================================================================
# Nirmana-Shell - Transpiled Theme: stelbent-compact.minimal
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$username\
$directory\
$git_branch\
$git_status\
$character\
$time\
$line_break\
$character\
"""

[username]
show_always = true
format = "[ ](#ff70a6)[$user](#757575)[ on](white) "

[directory]
format = "[](fg:#91ddff)[ $path](fg:#100e23 bg:#91ddff)[](fg:#91ddff) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[](fg:#95ffa4)[ $branch](fg:#100e23 bg:#95ffa4)"

[git_status]
format = "([$all_status$ahead_behind](fg:#100e23 bg:#95ffa4)[](fg:#95ffa4) )"
modified = " "
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[character]
success_symbol = "[❯ ](bold #ffffff) "
error_symbol = "[❯ ](bold #ef5350) "

[time]
disabled = false
time_format = "%H:%M:%S"
format = "[ $time](#689f38) "
