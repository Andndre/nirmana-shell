# =====================================================================
# Nirmana-Shell - Transpiled Theme: stelbent-compact.minimal
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler v3.1
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
[┏](fg:#CB4B16)\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$terraform\
$status\
$time\
$line_break\
$character\
"""

[character]
success_symbol = "[\\\\$ ](bold #ffffff) "
error_symbol = "[\\\\$ ](bold #ef5350) "

[username]
show_always = true
format = "[\\[](fg:#CB4B16)[$user](fg:#757575)[\\]](fg:#CB4B16)"

[directory]
format = "[┗\\[](fg:#CB4B16)[$path](fg:#100e23)[\\]](fg:#CB4B16)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = ""
format = "[\\[](fg:#CB4B16)[$symbol$branch](fg:#100e23)[\\]](fg:#CB4B16)"

[git_status]
disabled = true

[status]
disabled = false
format = "[\\[x](fg:#CB4B16)[$symbol](fg:#ffffff)[\\]](fg:#CB4B16)"
success_symbol = "0"
symbol = "$status"
