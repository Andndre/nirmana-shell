# =====================================================================
# Nirmana-Shell - Transpiled Theme: zash
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler v3.1
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = false

format = """
$username\
$directory\
$git_branch\
$git_status\
$character\
"""

[character]
success_symbol = "[ ](bold #DCB977) "
error_symbol = "[ ](bold #ef5350) "

[username]
format = "[$user ](bold #E36464)"
show_always = true

[directory]
format = "[$path ](fg:#56B6C2) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[ $branch](bold #D4AAFC)"

[git_status]
format = "([$all_status$ahead_behind](bold #D4AAFC)) "
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"
