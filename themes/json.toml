# =====================================================================
# Nirmana-Shell - Transpiled Theme: json
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler v3.1
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$line_break\
$character\
"""

[character]
success_symbol = "[> ](bold #FFFFFF) "
error_symbol = "[> ](bold #ef5350) "

[directory]
format = "[$path ](fg:#F1FA8C) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[ $branch](bold #43CCEA)"

[git_status]
format = "([$all_status$ahead_behind](bold #43CCEA)) "
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"
