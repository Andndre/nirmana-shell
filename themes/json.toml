# =====================================================================
# Nirmana-Shell - Transpiled Theme: json
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$line_break\
$character\
"""

[directory]
format = "[ $path](#F1FA8C) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[ $branch](#43CCEA)"

[git_status]
format = "([$all_status$ahead_behind](#43CCEA) )"
modified = " "
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[character]
success_symbol = "[❯](bold green) "
error_symbol = "[❯](bold red) "
