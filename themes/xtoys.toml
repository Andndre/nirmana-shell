# =====================================================================
# Nirmana-Shell - Transpiled Theme: xtoys
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler v3.1
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = false

format = """
${env_var.ADMIN}\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$character\
"""

[character]
success_symbol = "[❯❯❯ ](bold #7FFFD4) "
error_symbol = "[❯❯❯ ](bold #E84855) "

[env_var.ADMIN]
variable = "STARSHIP_IS_ADMIN"
style = "bold #CECE04"
format = "[# ](fg:#CECE04) "

[username]
format = "[$user ](bold #43CCEA)"
show_always = true

[hostname]
format = "[@$hostname ](bold #43CCEA) "
ssh_only = true

[directory]
format = "[$path ](fg:#7B68EE) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[on ](fg:#ffffff)[ $branch](bold #48D1CC)"

[git_status]
format = "([$all_status$ahead_behind](bold #48D1CC)) "
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"
