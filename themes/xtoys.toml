# =====================================================================
# Nirmana-Shell - Transpiled Theme: xtoys
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$username\
$directory\
$git_branch\
$git_status\
$line_break\
$sudo\
$character\
"""

[sudo]
disabled = false
symbol = "⚡ "
format = "[⚡ ](#CECE04) "

[username]
show_always = true
format = "[ ](#ff70a6)[$user](yellow) "

[directory]
format = "[ $path](#7B68EE) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[ $branch](#48D1CC)"

[git_status]
format = "([$all_status$ahead_behind](#48D1CC) )"
modified = " "
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[character]
success_symbol = "[❯ ](bold #7FFFD4) "
error_symbol = "[❯ ](bold #E84855) "
