# =====================================================================
# Nirmana-Shell - Transpiled Theme: markbull
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$username\
$directory\
$git_branch\
$git_status\
$fill\
$cmd_duration\
$line_break\
$character\
"""

[fill]
symbol = " "

[username]
show_always = true
format = "[$user](fg:#1d1626 bg:#ffce7b)[](fg:#ffce7b) "

[directory]
format = "[ $path](fg:#fffef9 bg:#C678DD)[](fg:#C678DD) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[](fg:#fffffb)[ $branch](fg:#100e23 bg:#fffffb)"

[git_status]
format = "([$all_status$ahead_behind](fg:#100e23 bg:#fffffb)[](fg:#fffffb) )"
modified = " "
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[cmd_duration]
min_time = 1
format = "[](fg:#33a3dc)[ $duration](fg:#fffef9 bg:#33a3dc)[](fg:#33a3dc) "

[character]
success_symbol = "[\\$ ](bold #ffffff) "
error_symbol = "[\\$ ](bold #ef5350) "
