# =====================================================================
# Nirmana-Shell - Transpiled Theme: probua.minimal
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$username\
$directory\
$git_branch\
$git_status\
$line_break\
$character\
"""

[username]
format = "[$user](fg:#ffdd86) "
show_always = true

[directory]
format = "[ $path](fg:#42a9ff) "
truncation_length = 3
truncation_symbol = "…/"

[git_status]
format = "([$all_status$ahead_behind](red) )"
modified = " ✎"
staged = " "

[git_branch]
format = "[ $branch](white) "

[character]
success_symbol = "[> ](bold #ffdd86) "
error_symbol = "[> ](bold #42a9ff) "
