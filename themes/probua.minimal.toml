# =====================================================================
# Nirmana-Shell - Transpiled Theme: probua.minimal
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler v3.1
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$line_break\
$character\
"""

[character]
success_symbol = "[> ](bold #ffdd86) "
error_symbol = "[> ](bold #42a9ff) "

[username]
format = "[$user ](bold #ffdd86)"
show_always = true

[hostname]
format = "[@$hostname ](bold #ffdd86) "
ssh_only = true

[directory]
format = "[$path ](fg:#42a9ff) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[ $branch](bold #addb67)"

[git_status]
format = "([$all_status$ahead_behind](bold #addb67)) "
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"
