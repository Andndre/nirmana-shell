# =====================================================================
# Nirmana-Shell - Transpiled Theme: M365Princess
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler v3.1
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = false

format = """
$username\
$directory\
$git_branch\
$git_status\
$nodejs\
$character\
"""

[character]
format = "$symbol"
success_symbol = "[](fg:prev_bg) "
error_symbol = "[](fg:prev_bg) "

[username]
format = "[](fg:#9A348E)[ $user ](fg:#FFFFFF bg:#9A348E)"
show_always = true

[directory]
format = "[](fg:prev_bg bg:#DA627D)[ $path ](fg:#FFFFFF bg:#DA627D)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[](fg:prev_bg bg:#FCA17D)[  $branch ](fg:#FFFFFF bg:#FCA17D)"

[git_status]
format = "([$all_status$ahead_behind ](fg:#FFFFFF bg:#FCA17D))"
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[nodejs]
format = "[](fg:prev_bg bg:#86BBD8)[  $version ](fg:#FFFFFF bg:#86BBD8)[](fg:#86BBD8) "
