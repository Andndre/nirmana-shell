# =====================================================================
# Nirmana-Shell - Transpiled Theme: kushal
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$fill\
$shell\
$python\
$golang\
$rust\
$cmd_duration\
$time\
$line_break\
$sudo\
$character\
"""

[fill]
symbol = " "

[shell]
disabled = false
format = "[ $indicator](fg:#011627 bg:#00C7FC)[](fg:#00C7FC) "

[sudo]
disabled = false
symbol = "⚡ "
format = "[⚡ ](#D6DEEB) "

[python]
symbol = "󰌠 "
format = "[󰌠 $version](fg:#011627 bg:#FFDE57)[](fg:#FFDE57) "

[golang]
symbol = " "
format = "[ $version](fg:#ffffff bg:#7FD5EA)[](fg:#7FD5EA) "

[rust]
symbol = " "
format = "[ $version](fg:#193549 bg:#99908A)[](fg:#99908A) "

[git_branch]
format = "[](fg:#1BD4CD)[ $branch](fg:#011627 bg:#1BD4CD)"

[git_status]
format = "([$all_status$ahead_behind](fg:#011627 bg:#1BD4CD)[](fg:#1BD4CD) )"
modified = " "
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[character]
success_symbol = "[❯ ](bold #D6DEEB) "
error_symbol = "[❯ ](bold #ef5350) "

[cmd_duration]
min_time = 1
format = "[](fg:#575656)[ $duration](fg:#D6DEEB bg:#575656)[](fg:#575656) "

[time]
disabled = false
time_format = " %H:%M:%S |  %d %b, %A"
format = "[ $time](#F2D3B6) "

[directory]
format = "[  ](#00C7FC)[ in ](#B6D6F2)[ $path](#B6D6F2) "
truncation_length = 3
truncation_symbol = "…/"
