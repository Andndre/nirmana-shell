# =====================================================================
# Nirmana-Shell - Transpiled Theme: kushal
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$directory\
$shell\
$python\
$golang\
$rust\
$git_branch\
$git_status\
$fill\
$cmd_duration\
$line_break\
$character\
"""

[fill]
symbol = " "

[directory]
format = "[ $path](fg:cyan) "
truncation_length = 3
truncation_symbol = "…/"

[shell]
format = "[](fg:#00C7FC)[  $version ](fg:#011627 bg:#00C7FC)"

[python]
format = "[](fg:#00C7FC bg:#FFDE57)[ 󰌠 $version ](fg:#011627 bg:#FFDE57)"

[golang]
format = "[](fg:#FFDE57 bg:#7FD5EA)[  $version ](fg:#ffffff bg:#7FD5EA)"

[rust]
format = "[](fg:#7FD5EA bg:#99908A)[  $version ](fg:#193549 bg:#99908A)"

[git_status]
format = "([$all_status$ahead_behind ](fg:#011627 bg:#1BD4CD))[](fg:#1BD4CD) "
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[git_branch]
format = "[](fg:#99908A bg:#1BD4CD)[  $branch](fg:#011627 bg:#1BD4CD)"

[cmd_duration]
format = "[](fg:#575656)[  $duration ](fg:#D6DEEB bg:#575656)"

[character]
success_symbol = "[❯ ](bold #D6DEEB) "
error_symbol = "[❯ ](bold #ef5350) "
