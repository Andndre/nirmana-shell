# =====================================================================
# Nirmana-Shell - Transpiled Theme: agnosterplus
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$username\
$directory\
$git_branch\
$git_status\
$fill\
$time\
$line_break\
$character\
"""

[fill]
symbol = " "

[time]
disabled = false
time_format = "%H:%M:%S"
format = "[ $time](#007ACC) "

[username]
show_always = true
format = "[](fg:#ffffff)[ $user](fg:#100e23 bg:#ffffff)[](fg:#ffffff) "

[directory]
format = "[](fg:#91ddff)[ $path](fg:#100e23 bg:#91ddff)[](fg:#91ddff) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[](fg:#95ffa4)[ $branch](fg:#193549 bg:#95ffa4)"

[git_status]
format = "([$all_status$ahead_behind](fg:#193549 bg:#95ffa4)[](fg:#95ffa4) )"
modified = " "
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[character]
success_symbol = "[❯](bold green) "
error_symbol = "[❯](bold red) "
