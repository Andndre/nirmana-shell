# =====================================================================
# Nirmana-Shell - Transpiled Theme: chips
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$fill\
$cmd_duration\
$time\
$battery\
$line_break\
$username\
$dart\
$nodejs\
$rust\
$python\
$character\
"""

[fill]
symbol = " "

[directory]
format = "[](fg:#FFD770)[ $path](fg:#212121 bg:#FFD770)[](fg:#FFD770) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = " [](fg:#66FFA6)[ $branch](fg:#212121 bg:#66FFA6)"

[git_status]
format = "([$all_status$ahead_behind](fg:#212121 bg:#66FFA6)[](fg:#66FFA6) )"
modified = " "
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[cmd_duration]
min_time = 1
format = "[](fg:#C6FF00)[ $duration](fg:#212121 bg:#C6FF00)[](fg:#C6FF00)  "

[time]
disabled = false
time_format = "%H:%M (%m/%d)"
format = "[](fg:#FFFF8D)[$time](fg:#212121 bg:#FFFF8D)[](fg:#FFFF8D)  "

[battery]
disabled = false
format = "[](fg:#FF867F)[$symbol$percentage](fg:#212121 bg:#FF867F)[](fg:#FF867F) "

[username]
show_always = true
format = "[ ](#ff70a6)[$user](yellow) "

[dart]
symbol = " "
format = "[](fg:#FF867F)[ $version](fg:#212121 bg:#FF867F)[](fg:#FF867F)  "

[nodejs]
symbol = "󰎙 "
format = "[](fg:#FF867F)[󰎙 $version](fg:#212121 bg:#FF867F)[](fg:#FF867F)  "

[rust]
symbol = " "
format = "[](fg:#FF867F)[ $version](fg:#212121 bg:#FF867F)[](fg:#FF867F)  "

[python]
symbol = "󰌠 "
format = "[](fg:#FF867F)[󰌠 $version](fg:#212121 bg:#FF867F)[](fg:#FF867F)  "

[character]
success_symbol = "[❯](bold green) "
error_symbol = "[❯](bold red) "
