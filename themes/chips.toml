# =====================================================================
# Nirmana-Shell - Transpiled Theme: chips
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$fill\
$cmd_duration\
$time\
$battery\
$line_break\
$username\
$dart\
$nodejs\
$rust\
$python\
$character\
"""

[fill]
symbol = " "

[directory]
format = "[ $path]() "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = " [ $branch](fg:p:c-badge-text bg:p:c-git-normal)"

[git_status]
format = "([$all_status$ahead_behind](fg:p:c-badge-text bg:p:c-git-normal))"
modified = " "
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[cmd_duration]
min_time = 1
format = "[ $duration](p:c-badge-text)  "

[time]
disabled = false
time_format = "%H:%M (%m/%d)"
format = "[$time](p:c-badge-text)  "

[battery]
disabled = false
format = "[$symbol$percentage](p:c-badge-text) "

[username]
show_always = true
format = "[ ](#ff70a6)[$user](yellow) "

[dart]
symbol = " "
format = "[ $version](p:c-badge-text)  "

[nodejs]
symbol = "󰎙 "
format = "[󰎙 $version](p:c-badge-text)  "

[rust]
symbol = " "
format = "[ $version](p:c-badge-text)  "

[python]
symbol = "󰌠 "
format = "[󰌠 $version](p:c-badge-text)  "

[character]
success_symbol = "[❯](bold green) "
error_symbol = "[❯](bold red) "
