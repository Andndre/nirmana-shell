# =====================================================================
# Nirmana-Shell - Transpiled Theme: chips
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$fill\
$cmd_duration\
$time\
$battery\
$line_break\
$character\
"""

[fill]
symbol = " "

[directory]
format = "[](fg:#FFD770)[  $path ](fg:#212121 bg:#FFD770)"
truncation_length = 3
truncation_symbol = "…/"

[git_status]
format = "([$all_status$ahead_behind ](fg:#212121 bg:#66FFA6))[](fg:#66FFA6) "
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[git_branch]
format = "[](fg:#FFD770 bg:#66FFA6)[  $branch](fg:#212121 bg:#66FFA6)"

[cmd_duration]
format = "[](fg:#C6FF00)[  $duration ](fg:#212121 bg:#C6FF00)"

[time]
format = "[](fg:#FFFF8D bg:#C6FF00)[  $time ](fg:#212121 bg:#FFFF8D)"
disabled = false
time_format = "%H:%M (%m/%d)"

[battery]
format = "[](fg:#FF867F bg:#FFFF8D)[ 󰁹 $percentage ](fg:#212121 bg:#FF867F)"
disabled = false

[character]
success_symbol = "[❯ ](bold #FAFAFA) "
error_symbol = "[❯ ](bold #ef5350) "
