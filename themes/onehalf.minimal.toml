# =====================================================================
# Nirmana-Shell - Transpiled Theme: onehalf.minimal
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$username\
$directory\
$git_branch\
$git_status\
$line_break\
$character\
"""

[username]
show_always = true
format = "[ ](#ff70a6)[$user](#e5c07b) "

[directory]
format = "[ $path](#61afef) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[ $branch](purple)"

[git_status]
format = "([$all_status$ahead_behind](purple) )"
modified = " "
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[character]
success_symbol = "[❯ ](bold #dcdfe4) "
error_symbol = "[❯ ](bold #ef5350) "
