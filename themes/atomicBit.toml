# =====================================================================
# Nirmana-Shell - Transpiled Theme: atomicBit
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$username\
$directory\
$git_branch\
$git_status\
$fill\
$nodejs\
$python\
$java\
$dotnet\
$golang\
$rust\
$dart\
$julia\
$ruby\
$aws\
$battery\
$time\
$line_break\
$sudo\
$character\
"""

[fill]
symbol = " "

[username]
show_always = true
format = "[ ](#ff70a6)[$user](yellow) "

[directory]
format = "[ $path](#ff5555) "
truncation_length = 3
truncation_symbol = "…/"

[sudo]
disabled = false
symbol = "⚡ "
format = "[⚡ ](#FF9248) "

[nodejs]
symbol = "󰎙 "
format = "[󰎙 $version](#3C873A) "

[python]
symbol = "󰌠 "
format = "[󰌠 $version](#FFE873) "

[java]
symbol = " "
format = "[ $version](#ec2729) "

[dotnet]
symbol = "󰪮 "
format = "[󰪮 $version](#0d6da8) "

[golang]
symbol = " "
format = "[ $version](#06aad5) "

[rust]
symbol = " "
format = "[ $version](#925837) "

[dart]
symbol = " "
format = "[ $version](#055b9c) "

[julia]
symbol = " "
format = "[ $version](#359a25) "

[ruby]
symbol = " "
format = "[ $version](#9c1006) "

[aws]
symbol = " "
format = "[ $version](#faa029) "

[battery]
disabled = false
format = "[$symbol$percentage](#ffffff) "

[time]
disabled = false
time_format = "_2,%H:%M"
format = "[ $time](#55ffff) "

[git_branch]
format = "[ $branch](#e0f8ff)"

[git_status]
format = "([$all_status$ahead_behind](#e0f8ff) )"
modified = " "
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[character]
success_symbol = "[❯ ](bold #ecf7fa) "
error_symbol = "[❯ ](bold #ef5350) "
