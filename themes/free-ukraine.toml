# =====================================================================
# Nirmana-Shell - Transpiled Theme: free-ukraine
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$fill\
$battery\
$cmd_duration\
$time\
$line_break\
$sudo\
$character\
"""

[fill]
symbol = " "

[directory]
format = "[  $path ](fg:#FBD951 bg:#0057b7)"
truncation_length = 3
truncation_symbol = "…/"

[git_status]
format = "([$all_status$ahead_behind ](fg:#0057b7 bg:#3379c5))[](fg:#3379c5) "
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[git_branch]
format = "[](fg:#0057b7 bg:#3379c5)[  $branch](fg:#0057b7 bg:#3379c5)"

[battery]
format = "[](fg:#0057b7)[ 󰁹 $percentage ](fg:#FBD951 bg:#0057b7)"
disabled = false

[cmd_duration]
format = "[  $duration ](fg:#FBD951 bg:#0057b7)"

[time]
format = "[  $time ](fg:#FBD951 bg:#0057b7)"
disabled = false
time_format = "_2,%H:%M"

[sudo]
disabled = false
symbol = " "
format = "[ ](#FBD951) "

[character]
success_symbol = "[ ](bold #0057b7) "
error_symbol = "[ ](bold #ef5350) "
