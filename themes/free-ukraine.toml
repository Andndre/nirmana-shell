# =====================================================================
# Nirmana-Shell - Transpiled Theme: free-ukraine
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler v3.1
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$status\
$fill\
$battery\
$cmd_duration\
$time\
$line_break\
$os\
${env_var.ADMIN}\
$username\
$character\
"""

[fill]
symbol = " "

[character]
success_symbol = "[ ](bold #0057b7) "
error_symbol = "[ ](bold #ef5350) "

[directory]
format = "[ $path ](fg:#FBD951 bg:#0057b7)[](fg:#0057b7)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[](fg:#3379c5 inverted)[  $branch ](fg:#0057b7 bg:#3379c5)"

[git_status]
format = "([$all_status$ahead_behind ](fg:#0057b7 bg:#3379c5))[](fg:#3379c5)"
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[status]
format = "[](fg:#ffd700 inverted)[ $symbol ](fg:#0057b7 bg:#ffd700)[](fg:#ffd700) "
disabled = false
symbol = "❌"
success_symbol = "♥"

[battery]
format = "[](fg:#0057b7 bg:prev_bg)[ 󰁹 $percentage ](fg:#FBD951 bg:#0057b7)"
disabled = false

[[battery.display]]
threshold = 100
style = "bold #A6E3A1"

[cmd_duration]
format = "[](fg:#0057b7 bg:prev_bg)[  $duration ](fg:#FBD951 bg:#0057b7)"
min_time = 2000

[time]
format = "[](fg:#0057b7 bg:prev_bg)[  $time ](fg:#FBD951 bg:#0057b7)[](fg:#0057b7)"
disabled = false
time_format = "_2,%H:%M"

[os]
disabled = false
style = "fg:#ffd700 bg:#0057b7"
format = "[ $symbol ]($style)"

[os.symbols]
Windows = "󰕮"
Ubuntu = ""
Macos = ""
Linux = ""

[env_var.ADMIN]
variable = "STARSHIP_IS_ADMIN"
style = "fg:#FBD951 bg:#0057b7"
format = "[ ](fg:#FBD951 bg:#0057b7)[ ⚡ ]($style)"

[username]
format = "[](fg:prev_bg bg:#FBD951)[ $user ](fg:#0057b7 bg:#FBD951)[](fg:#FBD951) "
show_always = true
