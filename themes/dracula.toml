# =====================================================================
# Nirmana-Shell - Custom Theme: Dracula Theme
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$bun\
$dart\
$nodejs\
$python\
$package\
$cmd_duration\
$line_break\
$character"""

[character]
success_symbol = "[❯](bold #50fa7b) "
error_symbol = "[❯](bold #ff5555) "

[directory]
format = "[](fg:#bd93f9)[ $path ](bg:#bd93f9 fg:#282a36)[](fg:#bd93f9 bg:#ffb86c)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[  $branch](bg:#ffb86c fg:#282a36)"

[git_status]
format = "[$all_status$ahead_behind](bg:#ffb86c fg:#282a36)[](fg:#ffb86c) "
style = "bg:#ffb86c fg:#282a36"
conflicted = " 󰞇"
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"
untracked = " ?"
stashed = " "
modified = " !"
staged = " +"
renamed = " »"
deleted = " ✘"

[bun]
format = "[](fg:#6272a4)[ $version](bg:#6272a4 fg:#ffb86c)[](fg:#6272a4) "
version_format = "v${raw}"

[dart]
symbol = " "
format = "[](fg:#6272a4)[$symbol$version](bg:#6272a4 fg:#8be9fd)[](fg:#6272a4) "
version_format = "v${raw}"

[nodejs]
symbol = "󰎙 "
format = "[](fg:#6272a4)[$symbol$version](bg:#6272a4 fg:#50fa7b)[](fg:#6272a4) "
version_format = "v${raw}"

[python]
symbol = "󰌠 "
format = "[](fg:#6272a4)[$symbol$version](bg:#6272a4 fg:#f1fa8c)[](fg:#6272a4) "
version_format = "v${raw}"

[package]
symbol = "󰏗 "
format = "[](fg:#6272a4)[$symbol$version](bg:#6272a4 fg:#ff79c6)[](fg:#6272a4) "
version_format = "v${raw}"
disabled = false

[cmd_duration]
min_time = 2_000
format = "[](fg:#6272a4)[ $duration](bg:#6272a4 fg:#f8f8f2)[](fg:#6272a4) "
