# =====================================================================
# Nirmana-Shell - Transpiled Theme: cloud-native-azure
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler v3.1
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$status\
$fill\
$shell\
$battery\
$nodejs\
$python\
$golang\
$rust\
$php\
$package\
$time\
$line_break\
$azure\
$line_break\
$character\
"""

[fill]
symbol = " "

[character]
success_symbol = "[~ ](bold #E06C75) "
error_symbol = "[~ ](bold #ef5350) "

[username]
format = "[](fg:#c386f1)[ $user](fg:#ffffff bg:#c386f1)"
show_always = true

[hostname]
format = "[[@](bold #ffffff)$hostname ](fg:#ffffff bg:#c386f1)[](fg:#c386f1)"
ssh_only = false

[directory]
format = "[](fg:#ff479c inverted)[ $path ](fg:#ffffff bg:#ff479c)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[](fg:prev_bg bg:#fffb38)[  $branch ](fg:#193549 bg:#fffb38)"

[git_status]
format = "([$all_status$ahead_behind ](fg:#193549 bg:#fffb38))[](fg:#fffb38)"
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[status]
format = "[](fg:#2e9599 inverted)[ $symbol ](fg:#ffffff bg:#2e9599)[](fg:#2e9599) "
disabled = false
symbol = "❌"
success_symbol = ""

[shell]
format = "[](fg:#0077c2 bg:prev_bg)[  $indicator ](fg:#ffffff bg:#0077c2)"

[battery]
format = "[](fg:#f36943 bg:prev_bg)[ 󰁹 $percentage ](fg:#ffffff bg:#f36943)"
disabled = false

[[battery.display]]
threshold = 100
style = "bold #A6E3A1"

[nodejs]
format = "[](fg:#0b2942 bg:prev_bg)[ 󰎙 $version ](fg:#80D166 bg:#0b2942)"

[python]
format = "[](fg:#0b2942 bg:prev_bg)[ 󰌠 $version ](fg:#FFE873 bg:#0b2942)"

[golang]
format = "[](fg:#0b2942 bg:prev_bg)[  $version ](fg:#06AAD5 bg:#0b2942)"

[rust]
format = "[](fg:#0b2942 bg:prev_bg)[  $version ](fg:#F78C6C bg:#0b2942)"

[php]
format = "[](fg:#0b2942 bg:prev_bg)[  $version ](fg:#787CB5 bg:#0b2942)"

[package]
format = "[](fg:#0b2942 bg:prev_bg)[ 󰏗 $version ](fg:#AEA4BF bg:#0b2942)"

[time]
format = "[](fg:#2e9599 bg:prev_bg)[ $time ](fg:#111111 bg:#2e9599)[](fg:#2e9599)"
disabled = false
time_format = "%H:%M:%S"

[azure]
format = "[  $subscription ](fg:#000000 bg:#9ec3f0)[](fg:#9ec3f0) "
disabled = false
