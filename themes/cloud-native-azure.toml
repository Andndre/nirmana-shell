# =====================================================================
# Nirmana-Shell - Transpiled Theme: cloud-native-azure
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$username\
$directory\
$git_branch\
$git_status\
$fill\
$shell\
$battery\
$time\
$line_break\
$character\
"""

[fill]
symbol = " "

[username]
format = "[](fg:#c386f1)[$user ](fg:#ffffff bg:#c386f1)"
show_always = true

[directory]
format = "[](fg:#c386f1 bg:#ff479c)[  $path ](fg:#ffffff bg:#ff479c)"
truncation_length = 3
truncation_symbol = "…/"

[git_status]
format = "([$all_status$ahead_behind ](fg:#193549 bg:#fffb38))[](fg:#fffb38) "
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[git_branch]
format = "[](fg:#ff479c bg:#fffb38)[  $branch](fg:#193549 bg:#fffb38)"

[shell]
format = "[](fg:#0077c2)[  $version ](fg:#ffffff bg:#0077c2)"

[battery]
format = "[](fg:#f36943 bg:#0077c2)[ 󰁹 $percentage ](fg:#ffffff bg:#f36943)"
disabled = false

[time]
format = "[](fg:#2e9599 bg:#f36943)[  $time ](fg:#111111 bg:#2e9599)"
disabled = false
time_format = "%H:%M:%S"

[character]
success_symbol = "[~ ](bold #E06C75) "
error_symbol = "[~ ](bold #ef5350) "
