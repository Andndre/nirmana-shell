# =====================================================================
# Nirmana-Shell - Transpiled Theme: jv_sitecorian
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler v3.1
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$status\
$fill\
$time\
$cmd_duration\
$line_break\
$os\
${env_var.ADMIN}\
$username\
$character\
"""

[fill]
symbol = " "

[character]
success_symbol = "[ ](bold #2B2B2B) "
error_symbol = "[ ](bold #ef5350) "

[directory]
format = "[ $path ](fg:#ffffff bg:#185F7B)[](fg:#185F7B)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[](fg:#6f42c1 inverted)[  $branch ](fg:#ffffff bg:#6f42c1)"

[git_status]
format = "([$all_status$ahead_behind ](fg:#ffffff bg:#6f42c1))"
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[status]
format = "[](fg:prev_bg bg:#4caf50)[ $symbol ](fg:#ffffff bg:#4caf50)[](fg:#4caf50) "
disabled = false
symbol = "❌"
success_symbol = "♥"

[time]
format = "[](fg:#2B2B2B)[ $time ](fg:#ffffff bg:#2B2B2B)[](fg:#2B2B2B) "
disabled = false
time_format = "%I:%M:%S %p"

[cmd_duration]
format = "[](fg:#2B2B2B)[  $duration ](fg:#ffffff bg:#2B2B2B)[](fg:#2B2B2B) "
min_time = 2000

[os]
disabled = false
style = "fg:#1CA6A3 bg:#2B2B2B"
format = "[ $symbol ]($style)"

[os.symbols]
Windows = "󰕮"
Ubuntu = ""
Macos = ""
Linux = ""

[env_var.ADMIN]
variable = "STARSHIP_IS_ADMIN"
style = "fg:#FBD951 bg:#2B2B2B"
format = "[ ](fg:#FBD951 bg:#2B2B2B)[ ⚡ ]($style)"

[username]
format = "[](fg:prev_bg bg:#DC291E)[ $user ](fg:#ffffff bg:#DC291E)[](fg:#DC291E) "
show_always = true
