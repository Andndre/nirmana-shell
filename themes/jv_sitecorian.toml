# =====================================================================
# Nirmana-Shell - Transpiled Theme: jv_sitecorian
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$fill\
$time\
$cmd_duration\
$shell\
$line_break\
$sudo\
$character\
"""

[fill]
symbol = " "

[directory]
format = "[  $path ](fg:#ffffff bg:#185F7B)"
truncation_length = 3
truncation_symbol = "…/"

[git_status]
format = "([$all_status$ahead_behind ](fg:#ffffff bg:#6f42c1))[](fg:#6f42c1) "
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[git_branch]
format = "[](fg:#185F7B bg:#6f42c1)[  $branch](fg:#ffffff bg:#6f42c1)"

[time]
format = "[](fg:#2B2B2B)[  $time ](fg:#ffffff bg:#2B2B2B)"
disabled = false
time_format = "%I:%M:%S %p"

[cmd_duration]
format = "[  $duration ](fg:#ffffff bg:#2B2B2B)"

[shell]
format = "[](fg:#000000 bg:#2B2B2B)[  $version ](fg:#666666 bg:#000000)"

[sudo]
disabled = false
symbol = " "
format = "[ ](#FBD951) "

[character]
success_symbol = "[ ](bold #2B2B2B) "
error_symbol = "[ ](bold #ef5350) "
