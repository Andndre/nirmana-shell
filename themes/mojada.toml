# =====================================================================
# Nirmana-Shell - Transpiled Theme: mojada
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = false

format = """
$username\
$directory\
$git_branch\
$git_status\
$character\
$fill\
$cmd_duration\
$battery\
$time\
"""

[fill]
symbol = " "

[username]
format = "[](fg:#fbfbfb)[$user ](fg:#0077c2 bg:#fbfbfb)"
show_always = true

[directory]
format = "[](fg:#fbfbfb bg:#0077c2)[  $path ](fg:#ffffff bg:#0077c2)"
truncation_length = 3
truncation_symbol = "…/"

[git_status]
format = "([$all_status$ahead_behind ](fg:#193549 bg:#fffb38))[](fg:#fffb38) "
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[git_branch]
format = "[](fg:#0077c2 bg:#fffb38)[  $branch](fg:#193549 bg:#fffb38)"

[cmd_duration]
format = "[  $duration ](fg:#ffffff)"

[battery]
format = "[ 󰁹 $percentage ](fg:#ffffff bg:#f36943)"
disabled = false

[time]
format = "[](fg:#61afef bg:#f36943)[  $time ](fg:#ffffff bg:#61afef)"
disabled = false
time_format = "%H:%M (%a)"

[character]
success_symbol = ""
error_symbol = ""
