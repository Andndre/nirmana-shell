# =====================================================================
# Nirmana-Shell - Transpiled Theme: smoothie
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$python\
$directory\
$git_branch\
$git_status\
$nodejs\
$fill\
$character\
$cmd_duration\
$line_break\
$time\
$character\
"""

[fill]
symbol = " "

[python]
symbol = "󰌠 "
format = "[󰌠 $version](#b1ff4f) "

[directory]
format = "[ $path](#ffaed8) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[ $branch](#62beff)"

[git_status]
format = "([$all_status$ahead_behind](#62beff) )"
modified = " "
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[nodejs]
symbol = "󰎙 "
format = "[󰎙 $version](#98C379) "

[character]
success_symbol = "[❯ ](bold #fb0207) "
error_symbol = "[❯ ](bold #ef5350) "

[cmd_duration]
min_time = 1
format = "[ $duration](#9966ff) "

[time]
disabled = false
time_format = "%H:%M:%S"
format = "[ $time](#f5f5a6) "
