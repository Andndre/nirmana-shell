# =====================================================================
# Nirmana-Shell - Transpiled Theme: pure
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler v3.1
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$username\
$directory\
$git_branch\
$git_status\
$fill\
$cmd_duration\
$line_break\
$character\
"""

[fill]
symbol = " "

[character]
success_symbol = "[❯ ](bold #B48EAD) "
error_symbol = "[❯ ](bold #BF616A) "

[username]
format = "[$user ](bold #BF616A)"
show_always = true

[directory]
format = "[$path ](fg:#81A1C1) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[on ](fg:#ffffff)[ $branch](bold #6C6C6C)"

[git_status]
format = "([$all_status$ahead_behind](bold #6C6C6C)) "
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[cmd_duration]
format = "[ $duration ](bold #A3BE8C)"
min_time = 2000
