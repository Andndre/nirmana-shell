# =====================================================================
# Nirmana-Shell - Transpiled Theme: hunk
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$directory\
$nodejs\
$python\
$git_branch\
$git_status\
$fill\
$cmd_duration\
$username\
$shell\
$line_break\
$sudo\
$character\
"""

[fill]
symbol = " "

[directory]
format = "[](fg:#c44569)[  $path ](fg:#ffffff bg:#c44569)"
truncation_length = 3
truncation_symbol = "…/"

[nodejs]
format = "[](fg:#c44569 bg:#f78fb3)[ 󰎙 $version ](fg:#ffffff bg:#f78fb3)"

[python]
format = "[ 󰌠 $version ](fg:#ffffff bg:#f78fb3)"

[git_status]
format = "([$all_status$ahead_behind ](fg:#333333 bg:#caffbf))[](fg:#caffbf) "
modified = " ✎"
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[git_branch]
format = "[](fg:#f78fb3 bg:#caffbf)[  $branch](fg:#333333 bg:#caffbf)"

[cmd_duration]
format = "[](fg:#83769c)[  $duration ](fg:#ffffff bg:#83769c)"

[username]
format = "[](fg:#86BBD8 bg:#83769c)[ $user ](fg:#ffffff bg:#86BBD8)"

[shell]
format = "[](fg:#33658A bg:#86BBD8)[  $version ](fg:#ffffff bg:#33658A)"

[sudo]
disabled = false
symbol = " "
format = "[ ](yellow) "

[character]
success_symbol = "[❯ ](bold #ffffff) "
error_symbol = "[❯ ](bold #ef5350) "
