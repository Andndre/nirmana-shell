# =====================================================================
# Nirmana-Shell - Transpiled Theme: neko
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = false

format = """
$directory\
$git_branch\
$git_status\
$character\
$fill\
$directory\
$git_branch\
$time\
"""

[fill]
symbol = " "

[directory]
format = "[  $path ](fg:#56B6C2)"

[git_status]
format = "([$all_status$ahead_behind](red) )"
modified = " ✎"
staged = " "

[git_branch]
format = "[  $branch ](fg:#D0666F)"

[time]
format = "[  $time ](fg:#1a415d)"
disabled = false
time_format = "%H:%M"

[character]
success_symbol = ""
error_symbol = ""
