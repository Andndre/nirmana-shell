# =====================================================================
# Nirmana-Shell - Transpiled Theme: neko
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$fill\
$directory\
$git_branch\
$git_status\
$time\
$line_break\
$character\
"""

[fill]
symbol = " "

[directory]
format = "[ $path](#56B6C2) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[$branch](#D0666F)"

[git_status]
format = "([$all_status$ahead_behind](#D0666F) )"
modified = " "
staged = " "
stashed = " "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"

[time]
disabled = false
time_format = "%H:%M"
format = "[ $time](#1a415d) "

[character]
success_symbol = "[❯](bold green) "
error_symbol = "[❯](bold red) "
