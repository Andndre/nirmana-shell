# =====================================================================
# Nirmana-Shell - Transpiled Theme: kali
# Ported from Oh My Posh JSON schema via Nirmana OMP Transpiler
# =====================================================================

scan_timeout = 30
command_timeout = 1000
add_newline = true

format = """
$username\
$python\
$directory\
$git_branch\
$git_status\
$fill\
$cmd_duration\
$line_break\
$character\
"""

[fill]
symbol = " "

[username]
format = "[$user](fg:#80D8FF) "
show_always = true

[python]
format = "[󰌠 $version](fg:#FFD740) "

[directory]
format = "[ $path](fg:#FFFFFF) "
truncation_length = 3
truncation_symbol = "…/"

[git_status]
format = "([$all_status$ahead_behind](red) )"
modified = " ✎"
staged = " "

[git_branch]
format = "[ $branch](#FFFFFF) "

[cmd_duration]
format = "[  $duration ](fg:#FFFFFF)"

[character]
success_symbol = "[└─#\\$ ](bold #80D8FF) "
error_symbol = "[└─#\\$ ](bold #ef5350) "
